schema_version: v1.1
pipeline:
  workflow:
    manifest: {}
    inputs:
      request.max_iterations:
        contract:
          dtype: int64
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_iterations
        source:
          kind: request
        required: false
        default: 30
      package.false:
        contract:
          dtype: bool
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: false
      request.noise:
        contract:
          dtype: float32
          shape:
          - batch
          - 4
          - height
          - width
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: application
          name: noise
        required: true
        externally_suppliable: true
      request.input_ids:
        contract:
          dtype: int64
          shape:
          - batch
          - prompt_sequence
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
        externally_suppliable: true
      package.loop_0_active:
        contract:
          dtype: bool
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
    outputs:
      image:
        contract:
          dtype: float32
          shape:
          - batch
          - 3
          - height
          - width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: image
        value_range: negative_one_to_one
        stage: pre_adapter
      latent:
        contract:
          dtype: float32
          shape:
          - batch
          - 4
          - height
          - width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: tensor
        stage: pre_adapter
      noise_estimate:
        contract:
          dtype: float32
          shape:
          - batch
          - 4
          - height
          - noise_estimate_width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: tensor
        stage: pre_adapter
      latent_trajectory:
        contract:
          dtype: float32
          shape:
          - batch
          - 4
          - height
          - trajectory_width
          batch_layout:
            kind: request_aligned
            axis: 0
        role: tensor
        stage: pre_adapter
    components:
      text_encoder:
        implementation:
          kind: onnx
          artifact: text_encoder/model.onnx
        ports:
          roles:
            input_ids: token_ids
            encoder_hidden_states: encoder_hidden_states
        batch_capacity: {}
      denoiser:
        implementation:
          kind: onnx
          artifact: denoiser/model.onnx
        ports:
          roles:
            encoder_hidden_states: encoder_hidden_states
        batch_capacity: {}
      vae_decoder:
        implementation:
          kind: onnx
          artifact: vae_decoder/model.onnx
        batch_capacity: {}
      solver_step:
        implementation:
          kind: onnx
          artifact: policies/solver_step.onnx
        ports:
          inputs:
            sample:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
            derivative:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            schedule:
              dtype: float32
              shape:
              - schedule_length
          outputs:
            next_state:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
        contract:
          id: onnx-genai.solver-step
          version: '1'
          bindings:
            state: sample
            estimate: derivative
            step: step
            schedule: schedule
            next_state: next_state
        batch_capacity:
          uniform_dimensions:
          - channels
          - height
          - width
          - schedule_length
      continue_predicate:
        implementation:
          kind: onnx
          artifact: policies/continue_predicate.onnx
        ports:
          inputs:
            done:
              dtype: bool
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            continue:
              dtype: bool
              shape:
              - 1
        batch_capacity: {}
      model_input_scale:
        implementation:
          kind: onnx
          artifact: policies/model_input_scale.onnx
        ports:
          inputs:
            sample:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            schedule:
              dtype: float32
              shape:
              - schedule_length
          outputs:
            model_input:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
        batch_capacity:
          uniform_dimensions:
          - channels
          - height
          - width
          - schedule_length
      diffusion_schedule:
        implementation:
          kind: onnx
          artifact: policies/diffusion_schedule.onnx
        ports:
          inputs: {}
          outputs:
            schedule:
              dtype: float32
              shape:
              - 31
        batch_capacity: {}
      diffusion_timesteps:
        implementation:
          kind: onnx
          artifact: policies/diffusion_timesteps.onnx
        ports:
          inputs: {}
          outputs:
            schedule:
              dtype: float32
              shape:
              - 30
        batch_capacity: {}
      schedule_lookup:
        implementation:
          kind: onnx
          artifact: policies/schedule_lookup.onnx
        ports:
          inputs:
            schedule:
              dtype: float32
              shape:
              - schedule_length
            step:
              dtype: int64
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            timestep:
              dtype: float32
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
        batch_capacity:
          uniform_dimensions:
          - schedule_length
      tensor_scale:
        implementation:
          kind: onnx
          artifact: policies/tensor_scale.onnx
        ports:
          inputs:
            tensor:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
            scale:
              dtype: float32
              shape:
              - 1
          outputs:
            scaled:
              dtype: float32
              shape:
              - batch
              - channels
              - height
              - width
              batch_layout:
                kind: request_aligned
                axis: 0
        batch_capacity:
          uniform_dimensions:
          - channels
          - height
          - width
      initial_state_scale:
        implementation:
          kind: onnx
          artifact: policies/initial_state_scale.onnx
        ports:
          inputs: {}
          outputs:
            value:
              dtype: float32
              shape:
              - 1
        batch_capacity: {}
      image_output_clamp:
        implementation:
          kind: onnx
          artifact: policies/image_output_clamp.onnx
        ports:
          inputs:
            tensor:
              dtype: float32
              shape:
              - batch
              - axis_1
              - axis_2
              - axis_3
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            clamped:
              dtype: float32
              shape:
              - batch
              - axis_1
              - axis_2
              - axis_3
              batch_layout:
                kind: request_aligned
                axis: 0
        batch_capacity:
          uniform_dimensions:
          - axis_1
          - axis_2
          - axis_3
    state:
      latent_state:
        contract:
          dtype: float32
          shape:
          - batch
          - 4
          - height
          - width
          batch_layout:
            kind: request_aligned
            axis: 0
        scope: invocation
        initializer: diffusion.initial_state
        recurrence:
          kind: invariant
      loop_0_active:
        contract:
          dtype: bool
          shape:
          - 1
        scope: invocation
        initializer: package.loop_0_active
        recurrence:
          kind: invariant
    steps:
    - kind: loop
      setup:
      - kind: invoke
        component: diffusion_schedule
        inputs: {}
        outputs:
          schedule: diffusion.schedule
      - kind: invoke
        component: diffusion_timesteps
        inputs: {}
        outputs:
          schedule: diffusion.timesteps
      - kind: invoke
        component: initial_state_scale
        inputs: {}
        outputs:
          value: diffusion.initial_scale
      - kind: invoke
        component: tensor_scale
        inputs:
          tensor: request.noise
          scale: diffusion.initial_scale
        outputs:
          scaled: diffusion.initial_state
      - kind: invoke
        component: text_encoder
        inputs:
          input_ids: request.input_ids
        outputs:
          encoder_hidden_states: conditioning.hidden_states
      - kind: invoke
        component: continue_predicate
        inputs:
          done: package.false
        outputs:
          continue: setup.continue
      steps:
      - kind: invoke
        component: schedule_lookup
        inputs:
          schedule: diffusion.timesteps
          step: loop.iteration
        outputs:
          timestep: diffusion.timestep
      - kind: invoke
        component: model_input_scale
        inputs:
          sample: latent_state
          step: loop.iteration
          schedule: diffusion.schedule
        outputs:
          model_input: diffusion.model_input
      - kind: invoke
        component: denoiser
        inputs:
          sample: diffusion.model_input
          timestep: diffusion.timestep
          encoder_hidden_states: conditioning.hidden_states
        outputs:
          noise_pred: denoiser.estimate
      - kind: invoke
        component: solver_step
        inputs:
          sample: latent_state
          step: loop.iteration
          schedule: diffusion.schedule
          derivative: denoiser.estimate
        outputs:
          next_state: latent.body
      - kind: emit
        value: denoiser.estimate
        output: noise_estimate
        mode: append
        axis: 3
      - kind: emit
        value: latent.body
        output: latent_trajectory
        mode: append
        axis: 3
      - kind: invoke
        component: continue_predicate
        inputs:
          done: package.false
        outputs:
          continue: loop.continue
      continue_when: loop_0_active
      max_iterations: request.max_iterations
      carried:
      - cell: latent_state
        next: latent.body
      - cell: loop_0_active
        next: loop.continue
      iteration:
        value: loop.iteration
        contract:
          dtype: int64
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
    - kind: invoke
      component: vae_decoder
      inputs:
        latent: latent_state
      outputs:
        image: vae.raw_image
    - kind: invoke
      component: image_output_clamp
      inputs:
        tensor: vae.raw_image
      outputs:
        clamped: vae.image
    - kind: emit
      value: latent_state
      output: latent
      mode: replace
    - kind: emit
      value: vae.image
      output: image
      mode: replace
