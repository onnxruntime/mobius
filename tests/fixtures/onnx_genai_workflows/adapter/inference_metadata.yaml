schema_version: v1
pipeline:
  workflow:
    manifest:
      ir_version: '1.0'
      onnx_opsets:
        ai.onnx: 24
      adapter_abis:
        onnx-genai.parameter-overlay: '1'
      capabilities:
      - workflow_ssa
      - typed_emit
      - parameter_adapters
      - heterogeneous_adapter_batching
    inputs:
      request.row_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: row_ids
        source:
          kind: request
      request.active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: adapter_active
        source:
          kind: request
      request.request_epochs:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: request_epochs
        source:
          kind: request
      activations:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: opaque
        source:
          kind: application
          name: activations
      request.adapter_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: runtime
          version: '1.0'
          role: adapter_ids
        source:
          kind: request
      request.adapter_counts:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: adapter_counts
        source:
          kind: request
      request.adapter_scales:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: runtime
          version: '1.0'
          role: adapter_scales
        source:
          kind: request
    outputs:
      result:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role: tensor
        stage: pre_adapter
    components:
      decoder:
        implementation:
          kind: onnx
          artifact: model.onnx
        ports: {}
      overlay:
        implementation:
          kind: adapter
          abi: onnx-genai.parameter-overlay
          version: '1'
        ports:
          inputs:
            input:
              dtype: float32
              rank: 2
              shape:
              - batch
              - 2
          outputs:
            output:
              dtype: float32
              rank: 2
              shape:
              - batch
              - 2
        contract:
          id: onnx-genai.parameter-overlay
          version: '1'
          bindings:
            input: input
            output: output
          parameters:
            action: apply
            component: decoder
            parameter: projection
    state: {}
    steps:
    - kind: invoke
      component: overlay
      inputs:
        input: activations
      outputs:
        output: adapted
    - kind: emit
      value: adapted
      output: result
      mode: replace
    adapters:
      base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:3bc8619d443995ec33644536e15ad6e777609c63eb078273e098fb733d2c415f
      selection:
        row_ids: request.row_ids
        request_epochs: request.request_epochs
        adapter_ids: request.adapter_ids
        adapter_counts: request.adapter_counts
        scales: request.adapter_scales
        active: request.active
        max_adapters: 2
      application_capability: onnx-genai.adapters@1
      portable_fallback: true
      cache:
        max_entries: 2
        eviction: lru
      planning:
        bucket_by_adapter_set: true
        stable_buffers: true
        invalidate_capture_on_eviction: true
      artifacts:
        blue:
          index: 0
          identity: blue
          version: '1'
          base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:3bc8619d443995ec33644536e15ad6e777609c63eb078273e098fb733d2c415f
          rank: 1
          alpha: 1.0
          dtype: float32
          provenance: in_memory
          weights:
          - location: adapters/blue/adapter.json
            sha256: d9e67499ad74d4c2d62c45a79ceeea8dfa94893afde9615ea6030b79d052ddbe
            format: json
          targets:
          - component: decoder
            parameter: projection
            weight_key: projection
            input_features: 2
            output_features: 2
        green:
          index: 1
          identity: green
          version: '1'
          base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:3bc8619d443995ec33644536e15ad6e777609c63eb078273e098fb733d2c415f
          rank: 1
          alpha: 1.0
          dtype: float32
          provenance: in_memory
          weights:
          - location: adapters/green/adapter.json
            sha256: d49ae9a3336884fa1ed8503caca1380699788add893870a670f6290c473bc935
            format: json
          targets:
          - component: decoder
            parameter: projection
            weight_key: projection
            input_features: 2
            output_features: 2
        red:
          index: 2
          identity: red
          version: '1'
          base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:3bc8619d443995ec33644536e15ad6e777609c63eb078273e098fb733d2c415f
          rank: 1
          alpha: 1.0
          dtype: float32
          provenance: in_memory
          weights:
          - location: adapters/red/adapter.json
            sha256: b4bd656305aa2fea1d518df351af5fd3bf99b3d0a6c8bd8501dfc5107ac278a1
            format: json
          targets:
          - component: decoder
            parameter: projection
            weight_key: projection
            input_features: 2
            output_features: 2
