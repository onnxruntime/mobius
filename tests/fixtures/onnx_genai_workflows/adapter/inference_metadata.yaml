        revision: synthetic-revision
      weights:
      - location: adapters/peft/adapter.json
        loader_capability: onnx-genai.adapters.json@1
        sha256: 4351d2c682e0d1666ca3fdd6e967baaab6ab93c33cf5ace7bf3d6269713e85ce
