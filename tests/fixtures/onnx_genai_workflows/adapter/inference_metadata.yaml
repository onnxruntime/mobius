schema_version: v1
pipeline:
  workflow:
    manifest:
      ir_version: '1.0'
      onnx_opsets:
        ai.onnx: 24
      adapter_abis:
        onnx-genai.parameter-overlay: '1'
      capabilities:
      - workflow_ssa
      - typed_emit
      - parameter_adapters
      - heterogeneous_adapter_batching
    inputs:
      request.slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.slot_ids
      request.active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: adapter_active
        source:
          kind: request
      request.request_epochs:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: request_epochs
        source:
          kind: request
      activations:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: opaque
        source:
          kind: application
          name: activations
      request.adapter_segments:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: runtime
          version: '1.0'
          role: adapter_segments
        source:
          kind: request
      request.adapter_counts:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: adapter_counts
        source:
          kind: request
      request.adapter_scales:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role:
          kind: runtime
          version: '1.0'
          role: adapter_scales
        source:
          kind: request
    outputs:
      result:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 2
        role: tensor
        stage: pre_adapter
    components:
      decoder:
        implementation:
          kind: onnx
          artifact: model.onnx
        ports: {}
      overlay:
        implementation:
          kind: adapter
          abi: onnx-genai.parameter-overlay
          version: '1'
        ports:
          inputs:
            input:
              dtype: float32
              rank: 2
              shape:
              - batch
              - 2
          outputs:
            output:
              dtype: float32
              rank: 2
              shape:
              - batch
              - 2
        contract:
          id: onnx-genai.parameter-overlay
          version: '1'
          bindings:
            input: input
            output: output
          parameters:
            action: apply
            component: decoder
            parameter: projection
    state: {}
    steps:
    - kind: invoke
      component: overlay
      inputs:
        input: activations
      outputs:
        output: adapted
    - kind: emit
      value: adapted
      output: result
      mode: replace
adapters:
  base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:702704827be590661fd77676445ddaf1557e4f4d446eaa7bcfb78754466cccdb
  target_manifest:
    targets:
    - id: projection
      component: decoder
      initializer: projection
      node_name: projection
      output_name: projection.output
      activation_dtype: float32
      input_features: 2
      output_features: 2
      layer_index: 0
      rank: 1
      alpha: 1.0
      graph_inputs:
        a: lora.projection.a
        b: lora.projection.b
        scale: lora.projection.scale
  discovery_fallback: disabled
  selection:
    slot_ids: request.slot_ids
    request_epochs: request.request_epochs
    segments: request.adapter_segments
    adapter_counts: request.adapter_counts
    scales: request.adapter_scales
    active: request.active
    max_adapters: 2
  application_capability: onnx-genai.adapters@1
  portable_fallback: true
  cache:
    max_entries: 2
    eviction: lru
  planning:
    bucket_by_adapter_set: true
    stable_buffers: true
    invalidate_capture_on_eviction: true
  artifacts:
    blue:
      index: 0
      identity: blue
      version: '1'
      base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:702704827be590661fd77676445ddaf1557e4f4d446eaa7bcfb78754466cccdb
      rank: 1
      alpha: 1.0
      dtype: float32
      provenance:
        producer: mobius
      weights:
      - location: adapters/blue/adapter.json
        loader_capability: onnx-genai.adapters.json@1
        sha256: d9e67499ad74d4c2d62c45a79ceeea8dfa94893afde9615ea6030b79d052ddbe
        scale_encoding: alpha_over_rank
        format: json
      bindings:
      - target: projection
        weight_key: projection
    green:
      index: 1
      identity: green
      version: '1'
      base_model_fingerprint: onnx-genai-targeted-base-v1:sha256:702704827be590661fd77676445ddaf1557e4f4d446eaa7bcfb78754466cccdb
      rank: 1
      alpha: 1.0
      dtype: float32
      provenance:
        producer: mobius
      weights:
      - location: adapters/green/adapter.json
        loader_capability: onnx-genai.adapters.json@1
        sha256: d49ae9a3336884fa1ed8503caca1380699788add893870a670f6290c473bc935
        scale_encoding: alpha_over_rank
        format: json
      bindings:
      - target: projection
        weight_key: projection
    peft:
