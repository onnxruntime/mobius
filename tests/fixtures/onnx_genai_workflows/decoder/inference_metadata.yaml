schema_version: '1.0'
pipeline:
  workflow:
    manifest:
      ir_version: '1.0'
      onnx_opsets:
        ai.onnx: 24
      capabilities:
      - workflow_ssa
      - linear_effects
      - nested_control_flow
      - typed_emit
      - emit_valid_length
      - emit_row_identity
      - loop_induction_values
      - serving_service_contract
      - bounded_state_recurrence
    inputs:
      request.input_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - sequence
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
      request.max_iterations:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_output_tokens
        source:
          kind: request
        required: true
      package.eos_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - E
        role:
          kind: opaque
        source:
          kind: literal
        required: true
        default: 127
      package.one_token:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1
      package.max_context:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 8192
      request.prompt_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: prompt_lengths
        required: false
        default: -1
      request.eos_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - num_eos
        role:
          kind: opaque
        source:
          kind: application
          name: eos_ids
        required: false
        default: 127
      request.eos_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: eos_lengths
        required: false
        default: 1
      request.row_max_iterations:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: row_max_iterations
        required: false
        default: -1
      request.temperature:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_temperature
        source:
          kind: request
        required: false
        default: 1.0
      request.top_k:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_top_k
        source:
          kind: request
        required: false
        default: 1
      request.top_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_top_p
        source:
          kind: request
        required: false
        default: 1.0
      request.min_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_min_p
        source:
          kind: request
        required: false
        default: 0.0
      request.seed:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: seed
        source:
          kind: request
        required: false
        default: 0
      request.grammar_mask:
        contract:
          dtype: bool
          rank: 2
          shape:
          - batch
          - 128
        role:
          kind: opaque
        source:
          kind: application
          name: grammar_mask
        required: false
        default: true
      request.rng_offset:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: rng_offset
        required: false
        default: 0
      package.active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      package.not_done:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: false
      package.slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.slot_ids
        required: true
      package.cache_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
      package.zero_batch:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
    outputs:
      tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - generated_sequence
        role: tokens
        stage: pre_adapter
    components:
      model:
        implementation:
          kind: onnx
          artifact: model.onnx
      token_sampler:
        implementation:
          kind: onnx
          artifact: policies/token_sampler.onnx
        contract:
          id: onnx-genai.token-sampler
          version: '2'
          bindings:
            logits: logits
            token: token
            temperature: temperature
            top_k: top_k
            top_p: top_p
            min_p: min_p
            grammar_mask: grammar_mask
            active: active
            done: done
            rng_seed: seed
            rng_offset: offset
            rng_next_offset: next_offset
          parameters:
            mode: seeded_stochastic
            batching: per_row
            inactive_rows: preserve
        application_overridable: true
      termination:
        implementation:
          kind: onnx
          artifact: policies/termination.onnx
        contract:
          id: onnx-genai.termination-predicate
          version: '2'
          bindings:
            tokens: token_ids
            eos_ids: eos_ids
            iteration: iteration
            max_iterations: max_iterations
            eos_lengths: eos_lengths
            active: active
            previous_done: previous_done
            done: done
            next_active: next_active
            continue: continue
          parameters:
            batching: per_row
            inactive_rows: preserve
      token_state_update:
        implementation:
          kind: onnx
          artifact: policies/token_state_update.onnx
        contract:
          id: onnx-genai.state-update
          version: '2'
          bindings:
            current: current
            update: update
            lengths: lengths
            active: active
            done: done
            next: next
            next_lengths: next_lengths
            emitted_length: emitted_length
          parameters:
            batching: per_row
            inactive_rows: preserve
      last_token_logits:
        implementation:
          kind: onnx
          artifact: policies/last_token_logits.onnx
      decoder_state_initializer:
        implementation:
          kind: onnx
          artifact: policies/decoder_state_initializer.onnx
      decoder_step_update:
        implementation:
          kind: onnx
          artifact: policies/decoder_step_update.onnx
      cache_length_update:
        implementation:
          kind: onnx
          artifact: policies/cache_length_update.onnx
      termination_batch_initializer:
        implementation:
          kind: onnx
          artifact: policies/termination_batch_initializer.onnx
      iteration_broadcast:
        implementation:
          kind: onnx
          artifact: policies/iteration_broadcast.onnx
    state:
      token:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 1
        scope: invocation
        initializer: initializer.token_slot
        recurrence:
          kind: invariant
      logits:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 128
        scope: invocation
        initializer: decoder.setup.last_logits
        recurrence:
          kind: invariant
      generated_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: initializer.generated_lengths
        recurrence:
          kind: invariant
      active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.active
        recurrence:
          kind: invariant
      done:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.not_done
        recurrence:
          kind: invariant
      accepted_len:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.zero_batch
        recurrence:
          kind: invariant
      slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.slot_ids
        recurrence:
          kind: invariant
      cache_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: initializer.cache_lengths
        recurrence:
          kind: invariant
      rng_offset:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        scope: invocation
        class: semantic
        initializer: request.rng_offset
        recurrence:
          kind: invariant
      attention_mask:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - context
        scope: invocation
        initializer: initializer.attention_mask
        recurrence:
          kind: invariant
      position_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 1
        scope: invocation
        initializer: initializer.body_position_ids
        recurrence:
          kind: invariant
      cache_0:
        contract:
          dtype: float32
          rank: 4
          shape:
          - batch
          - 2
          - past_sequence
          - 8
        scope: invocation
        initializer: decoder.setup.present.0.key
        recurrence:
          kind: bounded
          axis: 2
          max: package.max_context
        service_group: decoder_cache
    serving:
      active: active
      done: done
      accepted_len: accepted_len
      slot_ids: slot_ids
      kv_service:
        paging: none
        allocation: runtime
        compaction: false
        groups:
          decoder_cache:
            sequence_axis: 2
            layout: bnsh
            logical_lengths: cache_lengths
            storage: shared_buffer
            ports:
              model:
                cache_0:
                  input: past_key_values.0.key
                  output: present.0.key
    steps:
    - kind: loop
      setup:
      - kind: invoke
        component: decoder_state_initializer
        inputs:
          prompt_tokens: request.input_ids
          prompt_lengths: request.prompt_lengths
          max_iterations: request.max_iterations
        outputs:
          attention_mask: initializer.attention_mask
          body_attention_mask: initializer.body_attention_mask
          token_slot: initializer.token_slot
          generated_lengths: initializer.generated_lengths
          cache_lengths: initializer.cache_lengths
          position_ids: initializer.position_ids
          body_position_ids: initializer.body_position_ids
          past_key_values.0.key: initializer.past_key_values.0.key
      - kind: invoke
        component: model
        inputs:
          input_ids: request.input_ids
          past_key_values.0.key: initializer.past_key_values.0.key
          attention_mask: initializer.attention_mask
          position_ids: initializer.position_ids
        outputs:
          logits: decoder.setup.logits
          present.0.key: decoder.setup.present.0.key
      - kind: invoke
        component: termination_batch_initializer
        inputs:
          input_eos_ids: request.eos_ids
          input_eos_lengths: request.eos_lengths
          input_max_iterations: request.row_max_iterations
          fallback_max_iterations: request.max_iterations
          active: package.active
        outputs:
          row_eos_ids: termination.eos_ids
          eos_lengths: termination.eos_lengths
          max_iterations: termination.max_iterations
      - kind: invoke
        component: last_token_logits
        inputs:
          logits: decoder.setup.logits
        outputs:
          last_logits: decoder.setup.last_logits
      steps:
      - kind: invoke
        component: iteration_broadcast
        inputs:
          value: loop.iteration
          active: active
        outputs:
          rows: loop.iteration_rows
      - kind: invoke
        component: token_sampler
        inputs:
          logits: logits
          temperature: request.temperature
          top_k: request.top_k
          top_p: request.top_p
          min_p: request.min_p
          grammar_mask: request.grammar_mask
          seed: request.seed
          offset: rng_offset
          active: active
          done: done
        outputs:
          token: sample.body
          next_offset: sample.next_offset
      - kind: invoke
        component: token_state_update
        inputs:
          current: token
          update: sample.body
          lengths: generated_lengths
          active: active
          done: done
        outputs:
          next: token.body
          next_lengths: token.next_lengths
          emitted_length: token.emitted_length
      - kind: invoke
        component: termination
        inputs:
          token_ids: sample.body
          eos_ids: termination.eos_ids
          eos_lengths: termination.eos_lengths
          iteration: loop.iteration_rows
          max_iterations: termination.max_iterations
          active: active
          previous_done: done
        outputs:
          done: loop.done
          continue: loop.continue
          next_active: loop.next_active
      - kind: invoke
        component: cache_length_update
        inputs:
          left: cache_lengths
          right: package.one_token
          active: active
          done: done
        outputs:
          total: cache_lengths.next
      - kind: invoke
        component: cache_length_update
        inputs:
          left: package.zero_batch
          right: package.one_token
          active: active
          done: done
        outputs:
          total: accepted_len.next
      - kind: emit
        value: token.body
        output: tokens
        mode: append
        valid_length: token.emitted_length
        when: active
        row_ids: slot_ids
      - kind: invoke
        component: decoder_step_update
        inputs:
          attention_mask: attention_mask
          logical_length: cache_lengths
          position_ids: position_ids
        outputs:
          next_attention_mask: decoder_step.body_attention_mask
          next_position_ids: decoder_step.body_position_ids
      - kind: invoke
        component: model
        inputs:
          input_ids: token.body
          past_key_values.0.key: cache_0
          attention_mask: decoder_step.body_attention_mask
          position_ids: position_ids
        outputs:
          logits: decoder.body.logits
          present.0.key: decoder.body.present.0.key
      - kind: invoke
        component: last_token_logits
        inputs:
          logits: decoder.body.logits
        outputs:
          last_logits: decoder.body.last_logits
      continue_when: active
      max_iterations: request.max_iterations
      carried:
      - cell: token
        next: token.body
      - cell: logits
        next: decoder.body.last_logits
      - cell: generated_lengths
        next: token.next_lengths
      - cell: active
        next: loop.next_active
      - cell: done
        next: loop.done
      - cell: cache_lengths
        next: cache_lengths.next
      - cell: accepted_len
        next: accepted_len.next
      - cell: slot_ids
        next: slot_ids
      - cell: rng_offset
        next: sample.next_offset
      - cell: attention_mask
        next: decoder_step.body_attention_mask
      - cell: position_ids
        next: decoder_step.body_position_ids
      - cell: cache_0
        next: decoder.body.present.0.key
      termination: generation_eos
      iteration:
        value: loop.iteration
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
