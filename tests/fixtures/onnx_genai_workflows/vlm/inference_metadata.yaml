schema_version: v1
preprocessing:
  image:
    transforms:
    - op: decode_rgb
      outputs:
      - image.transform_0
    - op: resize
      mode: pixel_area
      interpolation: bicubic
      min_pixels: 224
      max_pixels: 224
      size_multiple: 14
      inputs:
      - image.transform_0
      outputs:
      - image.transform_1
    - op: rescale
      scale: 0.00392156862745098
      inputs:
      - image.transform_1
      outputs:
      - image.transform_2
    - op: normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
      inputs:
      - image.transform_2
      outputs:
      - image.transform_3
    - op: patchify
      patch_size: 14
      flatten: true
      temporal_patch_size: 2
      merge_size: 1
      channel_order: channels_first
      inputs:
      - image.transform_3
      outputs:
      - image.transform_4
    - op: emit_grid_coordinates
      inputs:
      - image.transform_4
      outputs:
      - image.output_grid_dimensions
    outputs:
    - name: image.pixel_values
      content: pixels
      dtype: float32
      source: image.transform_4
      contract:
        dtype: float32
        rank: 2
        shape:
        - 4
        - 1176
    - name: image.grid_thw
      content: grid_dimensions
      dtype: int64
      source: image.output_grid_dimensions
      contract:
        dtype: int64
        rank: 2
        shape:
        - 1
        - 3
pipeline:
  workflow:
    manifest:
      ir_version: '1.0'
      onnx_opsets:
        ai.onnx: 24
      adapter_abis:
        onnx-genai.image-preprocess: '1'
      capabilities:
      - workflow_ssa
      - linear_effects
      - nested_control_flow
      - loop_induction_values
      - typed_emit
      - emit_valid_length
      - emit_row_identity
      - serving_service_contract
      - bounded_state_recurrence
    inputs:
      request.prompt_tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - sequence
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
      request.image:
        contract:
          dtype: uint8
          rank: 1
          shape:
          - encoded_bytes
        role:
          kind: runtime
          version: '1.0'
          role: media
        source:
          kind: request
        required: true
      request.max_iterations:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_output_tokens
        source:
          kind: request
        required: true
      request.prompt_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: prompt_lengths
        required: false
        default: -1
      request.eos_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - num_eos
        role:
          kind: opaque
        source:
          kind: application
          name: eos_ids
        required: false
        default: 2
      request.eos_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: eos_lengths
        required: false
        default: 1
      request.row_max_iterations:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: row_max_iterations
        required: false
        default: -1
      package.eos_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 2
      package.max_context:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 8192
      package.one:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1
      package.active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      package.false:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: false
      package.zero_batch:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
      package.slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.slot_ids
        required: true
      request.temperature:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_temperature
        source:
          kind: request
        required: false
        default: 1.0
      request.top_k:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_top_k
        source:
          kind: request
        required: false
        default: 1
      request.top_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_top_p
        source:
          kind: request
        required: false
        default: 1.0
      request.min_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: sampling_min_p
        source:
          kind: request
        required: false
        default: 0.0
      request.seed:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: seed
        source:
          kind: request
        required: false
        default: 0
      request.rng_counter:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: rng_counter
        required: false
        default: 0
      package.loop_0_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
    outputs:
      tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - generated_sequence
        role: tokens
        stage: pre_adapter
    components:
      vision_encoder:
        implementation:
          kind: onnx
          artifact: vision_encoder/model.onnx
      embedding:
        implementation:
          kind: onnx
          artifact: embedding/model.onnx
      decoder:
        implementation:
          kind: onnx
          artifact: decoder/model.onnx
      image_preprocess:
        implementation:
          kind: adapter
          abi: onnx-genai.image-preprocess
          version: '1'
        ports:
          inputs:
            encoded:
              dtype: uint8
              rank: 1
              shape:
              - encoded_bytes
          outputs:
            pixel_values:
              dtype: float32
              rank: 2
              shape:
              - 4
              - 1176
            grid_thw:
              dtype: int64
              rank: 2
              shape:
              - 1
              - 3
      token_sampler:
        implementation:
          kind: onnx
          artifact: policies/token_sampler.onnx
        contract:
          id: onnx-genai.token-sampler
          version: '2'
          bindings:
            logits: logits
            token: token
            temperature: temperature
            top_k: top_k
            top_p: top_p
            min_p: min_p
            active: active
            done: done
            seed: seed
            counter: counter
            next_counter: next_counter
          parameters:
            mode: seeded_stochastic
            batching: per_row
            inactive_rows: preserve
        application_overridable: true
      termination:
        implementation:
          kind: onnx
          artifact: policies/termination.onnx
        contract:
          id: onnx-genai.termination-predicate
          version: '2'
          bindings:
            tokens: tokens
            eos_ids: eos_ids
            iteration: iteration
            max_iterations: max_iterations
            eos_lengths: eos_lengths
            active: active
            done: done
            next_active: next_active
            continue: continue
          parameters:
            batching: per_row
            inactive_rows: preserve
      token_state_update:
        implementation:
          kind: onnx
          artifact: policies/token_state_update.onnx
        contract:
          id: onnx-genai.state-update
          version: '2'
          bindings:
            current: current
            update: update
            active: active
            done: done
            next: next
          parameters:
            batching: per_row
            inactive_rows: preserve
      last_token_logits:
        implementation:
          kind: onnx
          artifact: policies/last_token_logits.onnx
      decoder_state_initializer:
        implementation:
          kind: onnx
          artifact: policies/decoder_state_initializer.onnx
      decoder_step_update:
        implementation:
          kind: onnx
          artifact: policies/decoder_step_update.onnx
      termination_batch_initializer:
        implementation:
          kind: onnx
          artifact: policies/termination_batch_initializer.onnx
      token_to_slot:
        implementation:
          kind: onnx
          artifact: policies/token_to_slot.onnx
      generated_length_update:
        implementation:
          kind: onnx
          artifact: policies/generated_length_update.onnx
      cache_length_update:
        implementation:
          kind: onnx
          artifact: policies/cache_length_update.onnx
    state:
      token:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 1
        scope: invocation
        initializer: initializer.token_slot
        recurrence:
          kind: invariant
      logits:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 128
        scope: invocation
        initializer: decoder.setup.last_logits
        recurrence:
          kind: invariant
      generated_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: initializer.generated_lengths
        recurrence:
          kind: invariant
      attention_mask:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - context
        scope: invocation
        initializer: initializer.attention_mask
        recurrence:
          kind: invariant
      active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.active
        recurrence:
          kind: invariant
      done:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.false
        recurrence:
          kind: invariant
      accepted_len:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.zero_batch
        recurrence:
          kind: invariant
      slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.slot_ids
        recurrence:
          kind: invariant
      cache_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: initializer.cache_lengths
        recurrence:
          kind: invariant
      rng_counter:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: request.rng_counter
        recurrence:
          kind: invariant
      position_ids:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 1
        scope: invocation
        initializer: initializer.body_position_ids
        recurrence:
          kind: invariant
      cache_0:
        contract:
          dtype: float32
          rank: 4
          shape:
          - batch
          - 2
          - past_sequence
          - 8
        scope: invocation
        initializer: decoder.setup.present.0.key
        recurrence:
          kind: bounded
          axis: 2
          max: package.max_context
        service_group: decoder_cache
      cache_1:
        contract:
          dtype: float32
          rank: 4
          shape:
          - batch
          - 2
          - past_sequence
          - 8
        scope: invocation
        initializer: decoder.setup.present.0.value
        recurrence:
          kind: bounded
          axis: 2
          max: package.max_context
        service_group: decoder_cache
      loop_0_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        scope: invocation
        initializer: package.loop_0_active
        recurrence:
          kind: invariant
    serving:
      active: active
      done: done
      accepted_len: accepted_len
      slot_ids: slot_ids
      kv_service:
        paging: none
        allocation: runtime
        compaction: false
        groups:
          decoder_cache:
            sequence_axis: 2
            layout: bnsh
            logical_lengths: cache_lengths
            storage: shared_buffer
            ports:
              decoder:
                cache_0:
                  input: past_key_values.0.key
                  output: present.0.key
                cache_1:
                  input: past_key_values.0.value
                  output: present.0.value
    steps:
    - kind: loop
      setup:
      - kind: invoke
        component: image_preprocess
        inputs:
          encoded: request.image
        outputs:
          pixel_values: image.pixel_values
          grid_thw: image.grid_thw
      - kind: invoke
        component: vision_encoder
        inputs:
          pixel_values: image.pixel_values
          grid_thw: image.grid_thw
        outputs:
          image_features: vision.image_features
      - kind: invoke
        component: decoder_state_initializer
        inputs:
          prompt_tokens: request.prompt_tokens
          prompt_lengths: request.prompt_lengths
          max_iterations: request.max_iterations
        outputs:
          attention_mask: initializer.attention_mask
          body_attention_mask: initializer.body_attention_mask
          token_slot: initializer.token_slot
          generated_lengths: initializer.generated_lengths
          cache_lengths: initializer.cache_lengths
          position_ids: initializer.position_ids
          body_position_ids: initializer.body_position_ids
          past_key_values.0.key: initializer.past_key_values.0.key
          past_key_values.0.value: initializer.past_key_values.0.value
      - kind: invoke
        component: termination_batch_initializer
        inputs:
          input_eos_ids: request.eos_ids
          input_eos_lengths: request.eos_lengths
          input_max_iterations: request.row_max_iterations
          fallback_max_iterations: request.max_iterations
          active: package.active
        outputs:
          row_eos_ids: termination.eos_ids
          eos_lengths: termination.eos_lengths
          max_iterations: termination.max_iterations
      - kind: invoke
        component: embedding
        inputs:
          input_ids: request.prompt_tokens
          image_features: vision.image_features
        outputs:
          inputs_embeds: embedding.setup.embeds
      - kind: invoke
        component: decoder
        inputs:
          inputs_embeds: embedding.setup.embeds
          attention_mask: initializer.attention_mask
          position_ids: initializer.position_ids
          past_key_values.0.key: initializer.past_key_values.0.key
          past_key_values.0.value: initializer.past_key_values.0.value
        outputs:
          logits: decoder.setup.logits
          present.0.key: decoder.setup.present.0.key
          present.0.value: decoder.setup.present.0.value
      - kind: invoke
        component: last_token_logits
        inputs:
          logits: decoder.setup.logits
        outputs:
          last_logits: decoder.setup.last_logits
      steps:
      - kind: invoke
        component: token_sampler
        inputs:
          logits: logits
          temperature: request.temperature
          top_k: request.top_k
          top_p: request.top_p
          min_p: request.min_p
          seed: request.seed
          counter: rng_counter
          active: active
          done: done
        outputs:
          token: sample.body
          next_counter: sample.next_counter
      - kind: invoke
        component: termination
        inputs:
          tokens: sample.body
          eos_ids: termination.eos_ids
          eos_lengths: termination.eos_lengths
          iteration: loop.iteration
          max_iterations: termination.max_iterations
          active: active
        outputs:
          done: loop.done
          next_active: loop.next_active
          continue: loop.continue
      - kind: invoke
        component: cache_length_update
        inputs:
          left: cache_lengths
          right: package.one
          active: active
          done: done
        outputs:
          total: cache_lengths.next
      - kind: invoke
        component: cache_length_update
        inputs:
          left: package.zero_batch
          right: package.one
          active: active
          done: done
        outputs:
          total: accepted_len.next
      - kind: invoke
        component: token_to_slot
        inputs:
          token: sample.body
        outputs:
          slot: sample.slot
      - kind: invoke
        component: generated_length_update
        inputs:
          left: generated_lengths
          right: package.one
          active: active
          done: done
        outputs:
          total: token.next_lengths
      - kind: invoke
        component: generated_length_update
        inputs:
          left: package.zero_batch
          right: package.one
          active: active
          done: done
        outputs:
          total: token.emitted_length
      - kind: invoke
        component: token_state_update
        inputs:
          current: token
          update: sample.slot
          active: active
          done: done
        outputs:
          next: token.body
      - kind: emit
        value: token.body
        output: tokens
        mode: append
        valid_length: token.emitted_length
        when: active
        row_ids: slot_ids
      - kind: invoke
        component: decoder_step_update
        inputs:
          attention_mask: attention_mask
          logical_length: cache_lengths
          position_ids: position_ids
        outputs:
          next_attention_mask: decoder_step.body_attention_mask
          next_position_ids: decoder_step.body_position_ids
      - kind: invoke
        component: embedding
        inputs:
          input_ids: token.body
          image_features: vision.image_features
        outputs:
          inputs_embeds: embedding.body.embeds
      - kind: invoke
        component: decoder
        inputs:
          inputs_embeds: embedding.body.embeds
          attention_mask: decoder_step.body_attention_mask
          position_ids: position_ids
          past_key_values.0.key: cache_0
          past_key_values.0.value: cache_1
        outputs:
          logits: decoder.body.logits
          present.0.key: decoder.body.present.0.key
          present.0.value: decoder.body.present.0.value
      - kind: invoke
        component: last_token_logits
        inputs:
          logits: decoder.body.logits
        outputs:
          last_logits: decoder.body.last_logits
      continue_when: loop_0_active
      max_iterations: request.max_iterations
      carried:
      - cell: token
        next: token.body
      - cell: logits
        next: decoder.body.last_logits
      - cell: attention_mask
        next: decoder_step.body_attention_mask
      - cell: generated_lengths
        next: token.next_lengths
      - cell: rng_counter
        next: sample.next_counter
      - cell: active
        next: loop.next_active
      - cell: done
        next: loop.done
      - cell: accepted_len
        next: accepted_len.next
      - cell: slot_ids
        next: slot_ids
      - cell: cache_lengths
        next: cache_lengths.next
      - cell: position_ids
        next: decoder_step.body_position_ids
      - cell: cache_0
        next: decoder.body.present.0.key
      - cell: cache_1
        next: decoder.body.present.0.value
      - cell: loop_0_active
        next: loop.continue
      termination: generation_eos
      iteration:
        value: loop.iteration
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
