schema_version: v1
pipeline:
  workflow:
    manifest:
      ir_version: '1.0'
      onnx_opsets:
        ai.onnx: 24
      capabilities:
      - workflow_ssa
      - linear_effects
      - nested_control_flow
      - loop_induction_values
      - typed_emit
      - emit_valid_length
      - emit_row_identity
      - bounded_state_recurrence
      - serving_service_contract
      - grammar_guidance_adapter
      - adaptive_proposal_budget
      - advisory_state
      adapter_abis:
        onnx-genai.grammar-guidance: '1'
    inputs:
      request.tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 4
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
      request.seed:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: runtime
          version: '1.0'
          role: seed
        source:
          kind: request
        required: false
        default: 0
      request.max_iterations:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_output_tokens
        source:
          kind: request
        required: true
      package.zero:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
      package.one:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1
      package.max_context:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 4096
      package.false:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: false
      package.active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      request.slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.slot_ids
        required: true
      request.row_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.row_ids
        required: true
      request.cache_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: serving.cache_lengths
        required: false
        default: 0
      request.grammar_state:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: grammar.initial_state
        required: true
      request.grammar_transition_table:
        contract:
          dtype: int64
          rank: 2
          shape:
          - grammar_states
          - vocabulary
        role:
          kind: opaque
        source:
          kind: application
          name: grammar.transition_table
        required: true
      request.adaptive_k:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: adaptive.current_k
        required: false
        default: 1
      request.adaptive_estimates:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 24
        role:
          kind: opaque
        source:
          kind: application
          name: adaptive.estimates
        required: false
        default: 0.0
      request.draft_ms:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: telemetry.draft_ms
        required: true
      request.target_ms:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
        role:
          kind: opaque
        source:
          kind: application
          name: telemetry.target_ms
        required: true
      request.verifier.past_key_values.0.key:
        contract:
          dtype: float32
          rank: 4
          shape:
          - batch
          - 2
          - past_sequence
          - 8
        role:
          kind: opaque
        source:
          kind: application
          name: verifier.past_key_values.0.key
        required: true
    outputs:
      tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - accepted_sequence
        role: tokens
        stage: pre_adapter
    components:
      proposer:
        implementation:
          kind: onnx
          artifact: proposer/model.onnx
      verifier:
        implementation:
          kind: onnx
          artifact: verifier/model.onnx
      grammar_clone:
        implementation:
          kind: adapter
          abi: onnx-genai.grammar-guidance
          version: '1'
        ports:
          inputs:
            state:
              dtype: int64
              rank: 1
              shape:
              - batch
            tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - proposal
            valid_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            transition_table:
              dtype: int64
              rank: 2
              shape:
              - grammar_states
              - vocabulary
          outputs:
            next_state:
              dtype: int64
              rank: 1
              shape:
              - batch
            consumed_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            logits_mask:
              dtype: bool
              rank: 2
              shape:
              - batch
              - vocabulary
            forced_tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
            forced_length:
              dtype: int64
              rank: 1
              shape:
              - batch
        contract:
          id: onnx-genai.grammar-guidance
          version: '1'
          bindings:
            state: state
            tokens: tokens
            valid_length: valid_length
            transition_table: transition_table
            next_state: next_state
            consumed_length: consumed_length
            logits_mask: logits_mask
            forced_tokens: forced_tokens
            forced_length: forced_length
          parameters:
            action: clone
        effects:
        - grammar
      grammar_lookahead:
        implementation:
          kind: adapter
          abi: onnx-genai.grammar-guidance
          version: '1'
        ports:
          inputs:
            state:
              dtype: int64
              rank: 1
              shape:
              - batch
            tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - proposal
            valid_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            transition_table:
              dtype: int64
              rank: 2
              shape:
              - grammar_states
              - vocabulary
          outputs:
            next_state:
              dtype: int64
              rank: 1
              shape:
              - batch
            consumed_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            logits_mask:
              dtype: bool
              rank: 2
              shape:
              - batch
              - vocabulary
            forced_tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
            forced_length:
              dtype: int64
              rank: 1
              shape:
              - batch
        contract:
          id: onnx-genai.grammar-guidance
          version: '1'
          bindings:
            state: state
            tokens: tokens
            valid_length: valid_length
            transition_table: transition_table
            next_state: next_state
            consumed_length: consumed_length
            logits_mask: logits_mask
            forced_tokens: forced_tokens
            forced_length: forced_length
          parameters:
            action: lookahead
        effects:
        - grammar
      grammar_commit:
        implementation:
          kind: adapter
          abi: onnx-genai.grammar-guidance
          version: '1'
        ports:
          inputs:
            state:
              dtype: int64
              rank: 1
              shape:
              - batch
            tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - proposal
            valid_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            transition_table:
              dtype: int64
              rank: 2
              shape:
              - grammar_states
              - vocabulary
          outputs:
            next_state:
              dtype: int64
              rank: 1
              shape:
              - batch
            consumed_length:
              dtype: int64
              rank: 1
              shape:
              - batch
            logits_mask:
              dtype: bool
              rank: 2
              shape:
              - batch
              - vocabulary
            forced_tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
            forced_length:
              dtype: int64
              rank: 1
              shape:
              - batch
        contract:
          id: onnx-genai.grammar-guidance
          version: '1'
          bindings:
            state: state
            tokens: tokens
            valid_length: valid_length
            transition_table: transition_table
            next_state: next_state
            consumed_length: consumed_length
            logits_mask: logits_mask
            forced_tokens: forced_tokens
            forced_length: forced_length
          parameters:
            action: commit
        effects:
        - grammar
      speculative_acceptance:
        implementation:
          kind: onnx
          artifact: policies/speculative_acceptance.onnx
        contract:
          id: onnx-genai.speculative-verifier
          version: '1'
          bindings:
            target_scores: target_scores
            proposed_tokens: proposed_tokens
            accepted_tokens: accepted_tokens
            accepted_len: accepted_len
            done: done
            continue: continue
            seed: seed
            offset: offset
            next_offset: next_offset
      grammar_guidance:
        implementation:
          kind: onnx
          artifact: policies/grammar_guidance.onnx
      adaptive_k:
        implementation:
          kind: onnx
          artifact: policies/adaptive_k.onnx
        contract:
          id: onnx-genai.adaptive-proposal-budget
          version: '1'
          bindings:
            current_k: current_k
            accepted: accepted
            evaluated: evaluated
            committed_tokens: committed_tokens
            filled_proposal_budget: filled_proposal_budget
            draft_ms: draft_ms
            target_ms: target_ms
            estimates: estimates
            next_k: next_k
            next_estimates: next_estimates
      grammar_length:
        implementation:
          kind: onnx
          artifact: policies/grammar_length.onnx
      grammar_sampler_logits:
        implementation:
          kind: onnx
          artifact: policies/grammar_sampler_logits.onnx
      proposal_metrics:
        implementation:
          kind: onnx
          artifact: policies/proposal_metrics.onnx
      cache_length_update:
        implementation:
          kind: onnx
          artifact: policies/cache_length_update.onnx
    state:
      tokens_state:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - 4
        class: semantic
        scope: invocation
        initializer: request.tokens
        recurrence:
          kind: invariant
      rng_offset:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.zero
        recurrence:
          kind: invariant
      active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.active
        recurrence:
          kind: invariant
      done:
        contract:
          dtype: bool
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.false
        recurrence:
          kind: invariant
      accepted_len:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: package.zero
        recurrence:
          kind: invariant
      slot_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: request.slot_ids
        recurrence:
          kind: invariant
      row_ids:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: request.row_ids
        recurrence:
          kind: invariant
      cache_lengths:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: request.cache_lengths
        recurrence:
          kind: invariant
      grammar:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: semantic
        scope: invocation
        initializer: request.grammar_state
        recurrence:
          kind: invariant
      proposal_k:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
        class: advisory
        scope: invocation
        initializer: request.adaptive_k
        recurrence:
          kind: invariant
      adaptive_estimates:
        contract:
          dtype: float32
          rank: 2
          shape:
          - batch
          - 24
        class: advisory
        scope: invocation
        initializer: request.adaptive_estimates
        recurrence:
          kind: invariant
      cache_0:
        contract:
          dtype: float32
          rank: 4
          shape:
          - batch
          - 2
          - past_sequence
          - 8
        class: semantic
        scope: invocation
        initializer: request.verifier.past_key_values.0.key
        recurrence:
          kind: bounded
          axis: 2
          max: package.max_context
        service_group: verifier_cache
    serving:
      active: active
      done: done
      accepted_len: accepted_len
      slot_ids: slot_ids
      kv_service:
        paging: none
        allocation: runtime
        compaction: false
        groups:
          verifier_cache:
            sequence_axis: 2
            layout: bnsh
            logical_lengths: cache_lengths
            storage: shared_buffer
            ports:
              verifier:
                cache_0:
                  input: past_key_values.0.key
                  output: present.0.key
    steps:
    - kind: loop
      setup: []
      steps:
      - kind: invoke
        component: proposer
        inputs:
          tokens: tokens_state
          proposal_budget: proposal_k
        outputs:
          proposed_tokens: proposal.tokens
          proposal_scores: proposal.scores
      - kind: invoke
        component: proposal_metrics
        inputs:
          proposed_tokens: proposal.tokens
          requested_k: proposal_k
        outputs:
          evaluated: proposal.evaluated
          filled_proposal_budget: proposal.filled_budget
      - kind: invoke
        component: grammar_clone
        inputs:
          state: grammar
          tokens: proposal.tokens
          valid_length: package.zero
          transition_table: request.grammar_transition_table
        outputs:
          next_state: grammar.clone.state
          consumed_length: grammar.clone.consumed
          logits_mask: grammar.clone.mask
          forced_tokens: grammar.clone.forced
          forced_length: grammar.clone.forced_length
      - kind: invoke
        component: grammar_lookahead
        inputs:
          state: grammar.clone.state
          tokens: proposal.tokens
          valid_length: proposal.evaluated
          transition_table: request.grammar_transition_table
        outputs:
          next_state: grammar.lookahead.state
          consumed_length: grammar.valid_length
          logits_mask: grammar.lookahead.mask
          forced_tokens: grammar.lookahead.forced
          forced_length: grammar.lookahead.forced_length
      - kind: invoke
        component: verifier
        inputs:
          proposed_tokens: proposal.tokens
          past_key_values.0.key: cache_0
        outputs:
          target_scores: target.scores
          present.0.key: verifier.present.0.key
      - kind: invoke
        component: speculative_acceptance
        inputs:
          target_scores: target.scores
          proposed_tokens: proposal.tokens
          seed: request.seed
          offset: rng_offset
        outputs:
          accepted_tokens: acceptance.tokens
          accepted_len: acceptance.length
          done: acceptance.done
          continue: acceptance.continue
          next_offset: rng_offset.body
          rollback_len: acceptance.rollback_length
      - kind: invoke
        component: grammar_length
        inputs:
          left: acceptance.length
          right: grammar.valid_length
        outputs:
          minimum: grammar.committed_length
      - kind: invoke
        component: grammar_commit
        inputs:
          state: grammar
          tokens: acceptance.tokens
          valid_length: grammar.committed_length
          transition_table: request.grammar_transition_table
        outputs:
          next_state: grammar.next
          consumed_length: grammar.committed
          logits_mask: grammar.mask
          forced_tokens: grammar.forced
          forced_length: grammar.forced_length
      - kind: invoke
        component: grammar_sampler_logits
        inputs:
          logits: target.scores
        outputs:
          last_logits: grammar.sampler_logits
      - kind: invoke
        component: grammar_guidance
        inputs:
          logits: grammar.sampler_logits
          logits_mask: grammar.mask
          forced_tokens: grammar.forced
          forced_length: grammar.forced_length
        outputs:
          token: grammar.token
      - kind: invoke
        component: cache_length_update
        inputs:
          left: cache_lengths
          right: grammar.committed_length
        outputs:
          total: cache_lengths.next
      - kind: invoke
        component: adaptive_k
        inputs:
          current_k: proposal_k
          accepted: grammar.committed_length
          evaluated: proposal.evaluated
          committed_tokens: grammar.committed_length
          filled_proposal_budget: proposal.filled_budget
          draft_ms: request.draft_ms
          target_ms: request.target_ms
          estimates: adaptive_estimates
        outputs:
          next_k: adaptive.next_k
          next_estimates: adaptive.next_estimates
      - kind: emit
        value: acceptance.tokens
        output: tokens
        mode: append
        valid_length: grammar.committed_length
        row_ids: row_ids
      - kind: emit
        value: grammar.token
        output: tokens
        mode: append
        valid_length: grammar.forced_length
        row_ids: row_ids
      continue_when: active
      max_iterations: request.max_iterations
      carried:
      - cell: tokens_state
        next: acceptance.tokens
      - cell: rng_offset
        next: rng_offset.body
      - cell: active
        next: acceptance.continue
      - cell: done
        next: acceptance.done
      - cell: accepted_len
        next: grammar.committed_length
      - cell: slot_ids
        next: slot_ids
      - cell: row_ids
        next: row_ids
      - cell: cache_lengths
        next: cache_lengths.next
      - cell: grammar
        next: grammar.next
      - cell: proposal_k
        next: adaptive.next_k
      - cell: adaptive_estimates
        next: adaptive.next_estimates
      - cell: cache_0
        next: verifier.present.0.key
      iteration:
        value: speculative.iteration
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
