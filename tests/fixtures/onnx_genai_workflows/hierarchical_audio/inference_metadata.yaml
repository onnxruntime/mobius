            timestep: flow.timestep.value
        - kind: invoke
          component: overlap_blend
          inputs:
            latents: flow_latents
            initial_noise: chunk.initial_noise
            previous_latent: previous_latent
            overlap: chunk.overlap
            timestep: flow.timestep.value
          outputs:
            blended_latents: flow.blended
        - kind: invoke
          component: flow_inputs
          inputs:
            latents: flow.blended
            timestep: flow.timestep.value
          outputs:
            guided_latents: flow.guided_latents
            guided_timestep: flow.guided_timestep
        - kind: invoke
          component: transformer
          inputs:
            hidden_states: flow.guided_latents
            timestep: flow.guided_timestep
            encoder_hidden_states: chunk.guided_condition
          outputs:
            sample: flow.sample
        - kind: invoke
          component: flow_guidance
          inputs:
            sample: flow.sample
          outputs:
            velocity: flow.velocity
        - kind: invoke
          component: flow_solver
          inputs:
            sample: flow.blended
            derivative: flow.velocity
            schedule: flow.schedule
            step: flow.iteration
          outputs:
            next_state: flow.next_latents
        continue_when: loop_3_active
        max_iterations: package.flow_steps
        carried:
        - cell: flow_latents
          next: flow.next_latents
        - cell: loop_3_active
          next: active
        iteration:
          value: flow.iteration
          contract:
            dtype: int64
            rank: 1
            shape:
            - batch
            batch_layout:
              kind: request_aligned
              axis: 0
      - kind: invoke
        component: chunk_update
        inputs:
          latents: flow_latents
          previous_latent: previous_latent
          condition: chunk.spliced_condition
          overlap: chunk.overlap
        outputs:
          restored_latents: chunk.restored_latents
          next_previous_latent: chunk.next_previous_latent
          next_previous_condition: chunk.next_previous_condition
      - kind: invoke
        component: vocoder
        inputs:
          latents: chunk.restored_latents
        outputs:
          waveform: chunk.waveform
      - kind: invoke
        component: waveform_stitch
        inputs:
          waveform: chunk.waveform
          history: waveform
          chunk_index: chunk.iteration
          chunk_count: audio.chunk_count
        outputs:
          next_history: chunk.waveform.next
      continue_when: loop_2_active
      max_iterations: audio.chunk_count
      carried:
      - cell: previous_latent
        next: chunk.next_previous_latent
      - cell: previous_condition
        next: chunk.next_previous_condition
      - cell: waveform
        next: chunk.waveform.next
      - cell: flow_rng
        next: chunk.next_rng
      - cell: loop_2_active
        next: ar.initial.active
      iteration:
        value: chunk.iteration
        contract:
          dtype: int64
          rank: 0
          shape: []
    - kind: emit
      value: waveform
      output: audio
      mode: replace
