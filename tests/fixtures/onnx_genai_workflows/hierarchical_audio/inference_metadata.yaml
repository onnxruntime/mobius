schema_version: v1
pipeline:
  workflow:
    manifest:
      adapter_abis:
        onnx-genai.text-assembly: '1'
      capabilities:
      - workflow_ssa
      - nested_control_flow
      - loop_induction_values
      - loop_carried_state
      - typed_emit
      - serving_service_contract
      - bounded_state_recurrence
    inputs:
      request.prompt_tokens:
        contract:
          dtype: int64
          rank: 2
          shape:
          - batch
          - sequence_length
          batch_layout:
            kind: request_expanded
            axis: 0
            factor: 2
        role:
          kind: runtime
          version: '1.0'
          role: prompt_tokens
        source:
          kind: request
        required: true
      request.max_frames_with_warmup:
        contract:
          dtype: int64
          rank: 1
          shape:
          - 1
        role:
          kind: runtime
          version: '1.0'
          role: max_output_tokens
        source:
          kind: request
        required: true
      request.seed:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: runtime
          version: '1.0'
          role: seed
        source:
          kind: request
        required: false
        default: 0
      package.temperature:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1.0
      package.top_k:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 50
      package.top_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1.0
      package.min_p:
        contract:
          dtype: float32
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0.0
      package.one:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1
      package.one_batch:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 1
      package.local_steps:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 7
      package.local_context:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 9
      package.global_context:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 64
      package.carry_length:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 172
      package.max_waveform_samples:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 15876000
      package.flow_steps:
        contract:
          dtype: int64
          rank: 0
          shape: []
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 30
      package.flow_rng_offset:
        contract:
          dtype: int64
          rank: 1
          shape:
          - batch
          batch_layout:
            kind: request_aligned
            axis: 0
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: 0
      package.loop_1_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      package.loop_0_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      package.loop_3_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
      package.loop_2_active:
        contract:
          dtype: bool
          rank: 1
          shape:
          - 1
        role:
          kind: opaque
        source:
          kind: literal
        required: false
        default: true
    outputs:
      audio:
        contract:
          dtype: float32
          rank: 3
          shape:
          - batch
          - 2
          - samples
          batch_layout:
            kind: request_aligned
            axis: 0
        role: audio
        stage: pre_adapter
        media:
          container: wav
          encoding: pcm_s16_le
          sample_rate_hz: 32000
          source_sample_rate_hz: 44100
          channels: 2
          delivery: buffered
    components:
      language_model:
        implementation:
          kind: onnx
          artifact: language_model/model.onnx
        ports:
          roles:
            inputs_embeds: inputs_embeds
            attention_mask: attention_mask
            position_ids: position_ids
            logits: logits
            last_hidden_state: hidden_states
      language_model_embedding:
        implementation:
          kind: onnx
          artifact: language_model_embedding/model.onnx
        ports:
          roles:
            input_ids: token_ids
            inputs_embeds: inputs_embeds
      language_model_semantic_embedding:
        implementation:
          kind: onnx
          artifact: language_model_semantic_embedding/model.onnx
      rvq_depth_decoder:
        implementation:
          kind: onnx
          artifact: rvq_depth_decoder/model.onnx
        ports:
          roles:
            inputs_embeds: inputs_embeds
      rvq_depth_decoder_projection:
        implementation:
          kind: onnx
          artifact: rvq_depth_decoder_projection/model.onnx
      rvq_depth_decoder_embedding:
        implementation:
          kind: onnx
          artifact: rvq_depth_decoder_embedding/model.onnx
      rvq_depth_decoder_feedback_embedding:
        implementation:
          kind: onnx
          artifact: rvq_depth_decoder_feedback_embedding/model.onnx
      rvq_depth_decoder_heads:
        implementation:
          kind: onnx
          artifact: rvq_depth_decoder_heads/model.onnx
      condition_encoder:
        implementation:
          kind: onnx
          artifact: condition_encoder/model.onnx
        ports:
          roles:
            encoder_hidden_states: encoder_hidden_states
      transformer:
        implementation:
          kind: onnx
          artifact: transformer/model.onnx
        ports:
          roles:
            encoder_hidden_states: encoder_hidden_states
      vocoder:
        implementation:
          kind: onnx
          artifact: vocoder/model.onnx
      speech_text_assembly:
        implementation:
          kind: adapter
          abi: onnx-genai.text-assembly
          version: '1'
          artifact: speech_processor.json
        contract:
          id: onnx-genai.text-assembly
          version: '1'
      global_initializer:
        implementation:
          kind: onnx
          artifact: policies/global_initializer.onnx
        ports:
          inputs:
            prompt_tokens:
              dtype: int64
              rank: 2
              shape:
              - batch
              - prompt_sequence
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            attention_mask:
              dtype: int64
              rank: 2
              shape:
              - batch
              - past_sequence_length + sequence_length
              batch_layout:
                kind: request_aligned
                axis: 0
            position_ids:
              dtype: int64
              rank: 2
              shape:
              - batch
              - prompt_sequence
              batch_layout:
                kind: request_aligned
                axis: 0
            body_attention_mask:
              dtype: int64
              rank: 2
              shape:
              - batch
              - prompt_sequence + 1
              batch_layout:
                kind: request_aligned
                axis: 0
            body_position_ids:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
              batch_layout:
                kind: request_aligned
                axis: 0
            token_slot:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
              batch_layout:
                kind: request_aligned
                axis: 0
            past_key_values.0.key:
              dtype: float32
              rank: 4
              shape:
              - batch
              - 1
              - past_sequence_length
              - 4
              batch_layout:
                kind: request_aligned
                axis: 0
            past_key_values.0.value:
              dtype: float32
              rank: 4
              shape:
              - batch
              - 1
              - past_sequence_length
              - 4
              batch_layout:
                kind: request_aligned
                axis: 0
      global_step_update:
        implementation:
          kind: onnx
          artifact: policies/global_step_update.onnx
        ports:
          inputs:
            attention_mask:
              dtype: int64
              rank: 2
              shape:
              - batch
              - context
              batch_layout:
                kind: request_aligned
                axis: 0
            position_ids:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            next_attention_mask:
              dtype: int64
              rank: 2
              shape:
              - batch
              - context + 1
              batch_layout:
                kind: request_aligned
                axis: 0
            next_position_ids:
              dtype: int64
              rank: 2
              shape:
              - batch
              - 1
              batch_layout:
                kind: request_aligned
                axis: 0
      ar_initializer:
        implementation:
          kind: onnx
          artifact: policies/ar_initializer.onnx
        ports:
          inputs: {}
          outputs:
            frame_history:
              dtype: float32
              rank: 3
              shape:
              - 1
              - 0
              - 64
            rng_counter:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            active:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            done:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
      length_step:
        implementation:
          kind: onnx
          artifact: policies/length_step.onnx
        ports:
          inputs:
            left:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            right:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            total:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
      guided_vocabulary:
        implementation:
          kind: onnx
          artifact: policies/guided_vocabulary.onnx
        ports:
          inputs:
            logits:
              dtype: float32
              rank: 3
              shape:
              - 2
              - sequence
              - vocabulary
          outputs:
            candidate_logits:
              dtype: float32
              rank: 2
              shape:
              - 1
              - 16385
      sampler:
        implementation:
          kind: onnx
          artifact: policies/sampler.onnx
        ports:
          inputs:
            logits:
              dtype: float32
              rank: 2
              shape:
              - batch
              - vocabulary
              batch_layout:
                kind: request_aligned
                axis: 0
            temperature:
              dtype: float32
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            top_k:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            top_p:
              dtype: float32
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            min_p:
              dtype: float32
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            seed:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            counter:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            active:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            done:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            token:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            next_counter:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
        contract:
          id: onnx-genai.token-sampler
          version: '2'
          bindings:
            logits: logits
            token: token
            temperature: temperature
            top_k: top_k
            top_p: top_p
            min_p: min_p
            active: active
            done: done
            seed: seed
            counter: counter
            next_counter: next_counter
          parameters:
            mode: seeded_stochastic
            batching: per_row
            inactive_rows: preserve
        application_overridable: true
      candidate_map:
        implementation:
          kind: onnx
          artifact: policies/candidate_map.onnx
        ports:
          inputs:
            candidate:
              dtype: int64
              rank: 1
              shape:
              - 1
          outputs:
            token:
              dtype: int64
              rank: 1
              shape:
              - 1
            semantic_code:
              dtype: int64
              rank: 2
              shape:
              - 2
              - 1
            semantic_token:
              dtype: int64
              rank: 2
              shape:
              - 2
              - 1
            is_stop:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
      continue_predicate:
        implementation:
          kind: onnx
          artifact: policies/continue_predicate.onnx
        ports:
          inputs:
            done:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
          outputs:
            continue:
              dtype: bool
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
      last_global_hidden:
        implementation:
          kind: onnx
          artifact: policies/last_global_hidden.onnx
        ports:
          inputs:
            value:
              dtype: float32
              rank: 3
              shape:
              - 2
              - sequence
              - 8
          outputs:
            last:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
      local_initializer:
        implementation:
          kind: onnx
          artifact: policies/local_initializer.onnx
        ports:
          inputs:
            global_hidden:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
            semantic_embedding:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
          outputs:
            sequence:
              dtype: float32
              rank: 3
              shape:
              - 2
              - sequence
              - 8
            acoustic_codes:
              dtype: int64
              rank: 2
              shape:
              - 2
              - codes
            local_hidden_parts:
              dtype: float32
              rank: 3
              shape:
              - 1
              - parts
              - 8
      codebook_index:
        implementation:
          kind: onnx
          artifact: policies/codebook_index.onnx
        ports:
          inputs:
            left:
              dtype: int64
              rank: 0
              shape: []
            right:
              dtype: int64
              rank: 0
              shape: []
          outputs:
            total:
              dtype: int64
              rank: 0
              shape: []
      local_logits:
        implementation:
          kind: onnx
          artifact: policies/local_logits.onnx
        ports:
          inputs:
            all_codebook_logits:
              dtype: float32
              rank: 4
              shape:
              - codebooks
              - 2
              - sequence
              - vocabulary
            codebook_index:
              dtype: int64
              rank: 0
              shape: []
          outputs:
            logits:
              dtype: float32
              rank: 2
              shape:
              - 1
              - vocabulary
      embedding_id:
        implementation:
          kind: onnx
          artifact: policies/embedding_id.onnx
        ports:
          inputs:
            token:
              dtype: int64
              rank: 1
              shape:
              - 1
            codebook_index:
              dtype: int64
              rank: 0
              shape: []
          outputs:
            embedding_ids:
              dtype: int64
              rank: 2
              shape:
              - 2
              - 1
      local_append:
        implementation:
          kind: onnx
          artifact: policies/local_append.onnx
        ports:
          inputs:
            sequence:
              dtype: float32
              rank: 3
              shape:
              - 2
              - sequence
              - 8
            projected_embedding:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
            acoustic_codes:
              dtype: int64
              rank: 2
              shape:
              - 2
              - codes
            token:
              dtype: int64
              rank: 1
              shape:
              - 1
            hidden_states:
              dtype: float32
              rank: 3
              shape:
              - 2
              - sequence
              - 8
            local_hidden_parts:
              dtype: float32
              rank: 3
              shape:
              - 1
              - parts
              - 8
          outputs:
            next_sequence:
              dtype: float32
              rank: 3
              shape:
              - 2
              - next_sequence_dim_1
              - 8
            next_acoustic_codes:
              dtype: int64
              rank: 2
              shape:
              - 2
              - next_acoustic_codes_dim_1
            next_local_hidden_parts:
              dtype: float32
              rank: 3
              shape:
              - 1
              - next_local_hidden_parts_dim_1
              - 8
      frame_append:
        implementation:
          kind: onnx
          artifact: policies/frame_append.onnx
        ports:
          inputs:
            history:
              dtype: float32
              rank: 3
              shape:
              - 1
              - frames
              - 64
            global_hidden:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
            local_hidden_parts:
              dtype: float32
              rank: 3
              shape:
              - 1
              - 7
              - 8
          outputs:
            next_history:
              dtype: float32
              rank: 3
              shape:
              - 1
              - next_history_dim_1
              - 64
      acoustic_frame:
        implementation:
          kind: onnx
          artifact: policies/acoustic_frame.onnx
        ports:
          inputs:
            acoustic_codes:
              dtype: int64
              rank: 2
              shape:
              - 2
              - 7
          outputs:
            framed_acoustic_codes:
              dtype: int64
              rank: 3
              shape:
              - 2
              - 1
              - 7
      feedback_sum:
        implementation:
          kind: onnx
          artifact: policies/feedback_sum.onnx
        ports:
          inputs:
            semantic:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
            acoustic:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
          outputs:
            feedback:
              dtype: float32
              rank: 3
              shape:
              - 2
              - 1
              - 8
      finalize_frames:
        implementation:
          kind: onnx
          artifact: policies/finalize_frames.onnx
        ports:
          inputs:
            history:
              dtype: float32
              rank: 3
              shape:
              - 1
              - frames_with_warmup
              - 64
            stopped:
              dtype: bool
              rank: 1
              shape:
              - 1
          outputs:
            frame_hiddens:
              dtype: float32
              rank: 3
              shape:
              - 1
              - frames
              - 64
      chunk_plan:
        implementation:
          kind: onnx
          artifact: policies/chunk_plan.onnx
        ports:
          inputs:
            frame_hiddens:
              dtype: float32
              rank: 3
              shape:
              - 1
              - frames
              - 64
          outputs:
            chunk_count:
              dtype: int64
              rank: 0
              shape: []
            waveform:
              dtype: float32
              rank: 3
              shape:
              - batch
              - 2
              - samples
              batch_layout:
                kind: request_aligned
                axis: 0
            previous_latent:
              dtype: float32
              rank: 3
              shape:
              - 1
              - 128
              - 0
            previous_condition:
              dtype: float32
              rank: 3
              shape:
              - 1
              - 0
              - 2048
        contract:
          id: mobius.policy.audio-chunk-plan
          version: '1'
          bindings: {}
      chunk_slice:
        implementation:
          kind: onnx
          artifact: policies/chunk_slice.onnx
        ports:
          inputs:
            frame_hiddens:
              dtype: float32
              rank: 3
              shape:
              - 1
              - frames
              - 64
            chunk_index:
              dtype: int64
              rank: 0
              shape: []
          outputs:
            frame_chunk:
              dtype: float32
              rank: 3
              shape:
              - 1
              - chunk_frames
              - 64
        contract:
          id: mobius.policy.audio-chunk-slice
          version: '1'
          bindings: {}
      overlap_prepare:
        implementation:
          kind: onnx
          artifact: policies/overlap_prepare.onnx
        ports:
          inputs:
            condition:
              dtype: float32
              rank: 3
              shape:
              - 1
              - latent_length
              - 2048
            previous_condition:
              dtype: float32
              rank: 3
              shape:
              - 1
              - carry_length
              - 2048
            previous_latent:
              dtype: float32
              rank: 3
              shape:
              - 1
              - 128
              - carry_length
          outputs:
            guided_condition:
              dtype: float32
              rank: 3
              shape:
              - guided_condition_dim_0
              - guided_condition_dim_1
              - guided_condition_dim_2
            spliced_condition:
              dtype: float32
              rank: 3
              shape:
              - spliced_condition_dim_0
              - spliced_condition_dim_1
              - spliced_condition_dim_2
            overlap:
              dtype: int64
              rank: 0
              shape: []
            noise_row_shape:
              dtype: int64
              rank: 1
              shape:
              - 2
      latent_noise:
        implementation:
          kind: onnx
          artifact: policies/latent_noise.onnx
        ports:
          inputs:
            seed:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            offset:
              dtype: int64
              rank: 1
              shape:
              - batch
              batch_layout:
                kind: request_aligned
                axis: 0
            row_shape:
              dtype: int64
              rank: 1
              shape:
              - 2
          outputs:
            noise:
              dtype: float32
              rank: 3
              shape:
              - batch
              - channels
              - latent_length
              batch_layout:
                kind: request_aligned
                axis: 0
            next_offset:
