preprocessing:
  image:
    transforms:
    - op: decode_rgb
    - op: resize
      mode: aspect_ratio_patch_budget
      patch_size: 16
      max_patches: 2520
      pooling_kernel_size: 3
      interpolation: bicubic
    - op: rescale
      scale: 0.00392156862745098
    - op: patchify
      patch_size: 16
      channel_order: channels_last
      coordinate_order: xy
      flatten: true
    - op: pad
      pad_value: 0
      target_length: 2520
    outputs:
    - name: vision_encoder.pixel_values
      content: pixels
      dtype: fp16
    - name: vision_encoder.pixel_position_ids
      content: patch_coordinates
      dtype: int64
      pad_value: -1
pipeline:
  models:
    decoder:
      filename: decoder/model.onnx
      type: decoder
      io: *id001
      tokenizer: tokenizer.json
    vision_encoder:
      filename: vision_encoder/model.onnx
      type: vision_encoder
      io:
        inputs:
        - name: pixel_values
          dtype: fp16
          rank: 3
          shape:
          - batch
          - num_patches
          - 768
          source:
            kind: generated
            generator: image_preprocessing
        - name: pixel_position_ids
          dtype: int64
          rank: 3
          shape:
          - batch
          - num_patches
          - 2
          source:
            kind: generated
            generator: image_preprocessing
        outputs:
        - name: image_features
          dtype: fp16
          rank: 2
          shape:
          - _d0*batch
          - 1536
    audio_encoder:
      filename: audio_encoder/model.onnx
      type: audio_encoder
      io:
        inputs:
        - name: input_features
          dtype: fp16
          rank: 3
          shape:
          - batch
          - time
          - 128
          source:
            kind: external
            input: request
        - name: input_features_mask
          dtype: bool
          rank: 2
          shape:
          - batch
          - time
          source:
            kind: external
            input: request
        outputs:
        - name: audio_features
          dtype: fp16
          rank: 3
          shape:
          - batch
          - floor(floor(time/2 - 1/2)/2) + 1
          - 1536
        - name: audio_features_mask
          dtype: bool
          rank: 2
          shape:
          - batch
          - _d1
    embedding:
      filename: embedding/model.onnx
      type: encoder
      io:
        inputs:
        - name: input_ids
          dtype: int64
          rank: 2
          shape:
          - batch
          - sequence_len
          source:
            kind: external
            input: request
        - name: image_features
          dtype: fp16
          rank: 2
          shape:
          - num_image_tokens
          - 1536
          source:
            kind: dataflow
            from: vision_encoder.image_features
        - name: audio_features
          dtype: fp16
          rank: 2
          shape:
          - num_audio_tokens
          - 1536
          source:
            kind: external
            input: request
        outputs:
        - name: inputs_embeds
          dtype: fp16
          rank: 3
          shape:
          - batch
          - sequence_len
          - 1536
        - name: per_layer_inputs
          dtype: fp16
          rank: 3
          shape:
          - batch
          - sequence_len
          - 8960
        token_input: input_ids
        sequence_source: token_ids
  dataflow:
  - from: embedding.inputs_embeds
    to: decoder.inputs_embeds
    dtype: fp16
    rank: 3
    device_transfer: false
  - from: embedding.per_layer_inputs
    to: decoder.per_layer_inputs
    dtype: fp16
    rank: 3
    device_transfer: false
  - from: vision_encoder.image_features
    to: embedding.image_features
    dtype: fp16
    rank: 2
    device_transfer: false
  strategy:
    kind: composite
    stages:
    - name: run_vision_encoder
      strategy:
        kind: single_pass
        model: vision_encoder
      run_on: prompt_only
    - name: run_audio_encoder
      strategy:
        kind: single_pass
        model: audio_encoder
      run_on: prompt_only
    - name: run_embedding
      strategy:
        kind: single_pass
        model: embedding
      run_on: every_step
    - name: run_decoder
      strategy:
        kind: autoregressive
        decoder: decoder
      run_on: every_step
  phases:
    decoder:
      run_on: every_step
    vision_encoder:
      run_on: prompt_only
    audio_encoder:
      run_on: prompt_only
    embedding:
      run_on: every_step
  vision:
    image_placeholder_token_id: 258880
    image_token_id: 258880
    placeholder_per_image: true
    token_count_source: from_coordinates
    processor_summaries:
    - vision_encoder.pixel_position_ids
    token_pooling_factor: 9
    max_tokens_per_image: 280
  positions:
    input: position_ids
    rank: 1
    dtype: int64
    continuation: linear_increment
    axes:
    - sequence
