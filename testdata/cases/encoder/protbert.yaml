skip_reason: >-
  Upstream repo ships pytorch_model.bin only (no safetensors), which mobius
  does not load, and its config.json predates the mandatory model_type key.
  Both are resolvable locally -- convert the checkpoint to safetensors and
  build with --config <dir> -- but neither is reproducible from the hub id
  alone, so this case cannot run unattended.
notes: >-
  ProtBert: BERT-large over a 30-token amino-acid vocabulary, whitespace
  separated. No licence is declared on the model card. Verified by hand
  against HuggingFace at revision 7a89448: relative L2 error 1.7e-5 and
  per-residue cosine > 0.999999 on a padded batch of two proteins.
