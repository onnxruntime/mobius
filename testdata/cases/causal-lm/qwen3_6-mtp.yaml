model_id: "Qwen/Qwen3.6-27B"
model_type: "qwen3_5"
revision: "main"
task_type: "qwen35-mtp"
architecture: "Qwen35MtpModel"
dtype: "float32"

inputs:
  prompts:
    - "If a train travels 60 km in 45 minutes, what is its average speed in km/h?"

level: "L4"

generation:
  max_new_tokens: 8
  do_sample: false

ci_skip_reason: "Model is 27B — too large for CI to download/build."

notes: >
  Qwen3.6 MTP self-speculative head: a single full-attention layer that borrows
  the target's shared embed_tokens + lm_head (architecture: Qwen35MtpModel,
  task: qwen35-mtp). HuggingFace transformers discards the mtp.* weights on
  load, so the golden mtp_hidden is captured from the vLLM-ported PyTorch
  reference (draft/mtp/mtp_pt_reference.py), not HF. L4 is an argmax/cosine
  parity check on mtp_hidden (the head's pre-lm_head output, treated as the
  logit vector) over replayed inputs_embeds + target hidden_states stored in the
  companion qwen3_6-mtp_inputs.npz. The drafter ONNX is built directly from the
  27B checkpoint's mtp.* weights. dtype float32 for a precision-clean golden.
