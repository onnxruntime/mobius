notes: >
  Granite SWA 2B (GraniteSWAForCausalLM). Mixed full/sliding-window attention
  layers, learnable per-head attention sinks, per-layer RoPE theta, and the
  Granite embedding/attention/residual/logit scaling multipliers. The HF
  reference is pinned to eager attention because the sink is an extra logit in
  the softmax denominator, which SDPA cannot express
  (upstream sets ``GraniteSWAPreTrainedModel._supports_sdpa = False``).
