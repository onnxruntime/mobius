  eos_token_id: 120020  # <｜hy_place▁holder▁no▁2｜>, the HF generation_config EOS

notes: |
  Tencent Hy-MT2 1.8B multilingual translation model (HunYuanDenseV1
  architecture: GQA 16/4 heads, head_dim 128, QK-norm, tied embeddings,
  dynamic-NTK RoPE with alpha=1000). Same architecture family as the
  hy-mt1_5-1_8b case but the newer (2026.5) Hy-MT2 weights, so L4 prefill
  logits and L5 greedy generation are meaningful end-to-end checks.

  The prompt is pre-formatted with the Hy-MT chat template
  (<｜hy_begin▁of▁sentence｜><｜hy_User｜>...<｜hy_Assistant｜>) because
  generate_golden.py does not apply chat templates for causal-lm cases —
  feeding the raw instruction directly causes the model to hallucinate.
