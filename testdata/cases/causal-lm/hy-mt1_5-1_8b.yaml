notes: |
  Tencent Hy-MT1.5 1.8B translation model. Same architecture as the
  existing tiny-random hunyuan-v1-dense case, but with real weights so
  L4 prefill logits and L5 generation are meaningful. The repo name is
  "*-2bit" but it ships a full BF16 safetensors checkpoint alongside
  the 2-bit GGUF variant.

  The prompt is pre-formatted with the Hy-MT chat template
  (<｜hy_User｜>...<｜hy_Assistant｜>) because generate_golden.py does
  not apply chat templates for causal-lm cases — feeding the raw
  instruction directly causes the model to hallucinate.
