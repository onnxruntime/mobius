notes: "Gemma 3n E2B (text-only path). AltUp/Laurel per-layer routing with sliding + global attention, KV layer sharing (layers at/after first_kv_shared_layer_idx reuse the KV of the last non-shared layer of the same type), and per-layer activation sparsity on the early layers."
