name: GPU Examples

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-examples:
    name: Run Validation Example Scripts (GPU)
    runs-on:
      - self-hosted
      - "1ES.Pool=onnxruntime-ep-mobius-github-linux-a10"
      - "JobId=gpu-examples-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-examples-gpu-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: |
            pip-examples-gpu-

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-examples-gpu-${{ hashFiles('examples/*.py') }}
          restore-keys: |
            hf-examples-gpu-

      - name: Install PyTorch (CUDA)
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing,transformers,ort-genai]'
          pip install soundfile librosa ml_dtypes

      # ── Phi ──────────────────────────────────────────────────────

      - name: "phi4mm_multimodal (text mode)"
        run: python examples/phi4mm_multimodal.py --mode text
        timeout-minutes: 20

      - name: "phi4mm_ort_genai (vision)"
        run: >
          python examples/phi4mm_ort_genai.py
          --image testdata/pipeline-cat-chonk.jpeg
        timeout-minutes: 20

      # ── Qwen text ───────────────────────────────────────────────

      - name: "qwen35_text_generation"
        run: >
          python examples/qwen35_text_generation.py
          --device cuda --prompt "What is 2+2?"
        timeout-minutes: 20

      # ── Qwen vision-language ────────────────────────────────────

      - name: "qwen25_vl_ort_genai"
        run: >
          python examples/qwen25_vl_ort_genai.py
          --image testdata/pipeline-cat-chonk.jpeg
        timeout-minutes: 20

      - name: "qwen3_vl_ort_genai"
        run: >
          python examples/qwen3_vl_ort_genai.py
          --image testdata/pipeline-cat-chonk.jpeg
        timeout-minutes: 20

      - name: "qwen35_vl_ort_genai"
        run: >
          python examples/qwen35_vl_ort_genai.py
          --image testdata/pipeline-cat-chonk.jpeg
        timeout-minutes: 20

      # ── Qwen audio (file-based, no mic/speaker) ────────────────

      - name: "qwen3_asr"
        run: >
          python examples/qwen3_asr.py
          --audio testdata/652-129742-0006.flac
        timeout-minutes: 20

      - name: "qwen3_forced_aligner"
        run: >
          python examples/qwen3_forced_aligner.py
          --audio testdata/652-129742-0006.flac
          --text "He hoped there would be stew for dinner."
        timeout-minutes: 20

      # ── Qwen TTS (build-only — inference needs audio device) ───

      - name: "qwen3_tts (build-only)"
        run: >
          python examples/qwen3_tts.py
          --save-to /tmp/qwen3_tts_ci/
        timeout-minutes: 20

      # ── Nemotron ────────────────────────────────────────────────

      - name: "nemotron_3_nano_text_generation"
        run: >
          python examples/nemotron_3_nano_text_generation.py
          --device cuda --prompt "What is 2+2?"
        timeout-minutes: 20

      # ── Static cache ────────────────────────────────────────────

      - name: "static_cache_generation"
        run: python examples/static_cache_generation.py
        timeout-minutes: 20
