name: PR Workflow Report

on:
  workflow_run:
    workflows: [Architecture Diff, Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    name: Report results
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.name == 'Architecture Diff' && 'arch-diff-results' || 'benchmark-comparison' }}
          path: report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Update PR comment
        uses: actions/github-script@v9
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');

            const reports = {
              'Architecture Diff': {
                path: 'report/arch_diff.md',
                marker: '<!-- mobius-arch-diff-report -->',
              },
              'Benchmark': {
                path: 'report/comparison.md',
                marker: '<!-- mobius-benchmark-report -->',
              },
            };
            const report = reports[process.env.SOURCE_WORKFLOW];
            if (!report) {
              core.setFailed(`Unsupported source workflow: ${process.env.SOURCE_WORKFLOW}`);
              return;
            }

            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const stat = fs.lstatSync(report.path);
            if (!stat.isFile() || stat.isSymbolicLink()) {
              core.setFailed(`Report artifact is not a regular file: ${report.path}`);
              return;
            }
            if (stat.size > 60000) {
              core.setFailed(`Report artifact exceeds the 60000-byte limit: ${stat.size}`);
              return;
            }

            // The artifact was produced by PR-controlled code. Keep it as inert,
            // bounded text and prevent it from notifying arbitrary users or teams.
            const untrustedBody = fs.readFileSync(report.path, 'utf8');
            const sanitizedBody = untrustedBody
              .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
              .replace(/@/g, '@\u200B');
            const body = `${report.marker}\n${sanitizedBody}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              comment => comment.user.type === 'Bot' && comment.body.includes(report.marker),
            );
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (existing) {
              await github.rest.issues.updateComment({
                ...params,
                comment_id: existing.id,
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                issue_number: prNumber,
              });
            }
