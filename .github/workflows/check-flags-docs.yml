name: Check flags docs

on:
  pull_request:
    paths:
      - "src/mobius/_flags.py"
      - "docs/feature-flags.md"
      - "scripts/generate_flags_docs.py"

permissions:
  contents: read

jobs:
  check:
    name: Verify feature-flags docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e '.[testing]' -q

      - name: Regenerate docs
        run: python scripts/generate_flags_docs.py

      - name: Check for diff
        run: |
          if ! git diff --exit-code docs/feature-flags.md; then
            echo ""
            echo "❌ docs/feature-flags.md is out of date."
            echo "   Run 'python scripts/generate_flags_docs.py' and commit the result."
            exit 1
          fi
          echo "✅ docs/feature-flags.md is up to date."
