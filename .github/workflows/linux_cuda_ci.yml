name: Linux CUDA CI

# Consolidated 5-tier test pipeline for mobius.
# Tiers:
#   L1 — Graph construction smoke tests (CPU, fast)
#   L2 — Architecture validation with real HF configs (CPU, no weights)
#   L3 — Synthetic parity with random weights (CPU)
#   L4 — Checkpoint-verified golden comparison (GPU, real weights)
#   L5 — End-to-end generation tests (GPU, real weights)
#
# Reference: https://github.com/microsoft/onnxruntime/blob/main/.github/workflows/linux_cuda_ci.yml

on:
  push:
    branches: [main, 'rel-*']
  pull_request:
    branches: [main, 'rel-*']
  schedule:
    # Nightly at 3am UTC — runs full L1–L5 pipeline
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tiers:
        description: >-
          Comma-separated list of tiers to run (e.g. "L1,L3,L4").
          Leave empty to run all tiers.
        required: false
        default: ""
      models:
        description: >-
          Comma-separated list of model_type filters for pytest -k.
          Leave empty for all models.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # CUDA 12.8 for GPU runners; aligned with onnxruntime's CUDA version
  CUDA_VERSION: "12.8"
  TORCH_CPU_INDEX: "https://download.pytorch.org/whl/cpu"
  TORCH_CUDA_INDEX: "https://download.pytorch.org/whl/cu124"

# ---------------------------------------------------------------------------
# Helper: should a tier run?
#
# Schedule (nightly/weekly) → all tiers
# Push to main              → L1, L3, selective L4
# PR                        → L1, L3 (affected models only)
# workflow_dispatch          → selected tiers (or all)
# ---------------------------------------------------------------------------

jobs:
  # =========================================================================
  # Setup: detect affected models on PRs for selective testing
  # =========================================================================
  detect-affected:
    name: Detect Affected Models
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      run_all: ${{ steps.detect.outputs.run_all }}
      has_affected: ${{ steps.detect.outputs.has_affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Detect affected models
        id: detect
        run: |
          output=$(python scripts/detect_affected_models.py \
            --stdin --output-format github < changed_files.txt)
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # Tier selector: compute which tiers to run based on trigger + inputs
  # =========================================================================
  tier-selector:
    name: Determine Tiers
    runs-on: ubuntu-latest
    outputs:
      run_l1: ${{ steps.select.outputs.run_l1 }}
      run_l2: ${{ steps.select.outputs.run_l2 }}
      run_l3: ${{ steps.select.outputs.run_l3 }}
      run_l4: ${{ steps.select.outputs.run_l4 }}
      run_l5: ${{ steps.select.outputs.run_l5 }}
    steps:
      - name: Select tiers
        id: select
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          INPUT_TIERS="${{ inputs.tiers }}"

          # Default: all tiers off
          L1=false; L2=false; L3=false; L4=false; L5=false

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TIERS" ]; then
            # Manual: run only selected tiers
            for tier in $(echo "$INPUT_TIERS" | tr ',' ' '); do
              case "$tier" in
                L1|l1) L1=true ;;
                L2|l2) L2=true ;;
                L3|l3) L3=true ;;
                L4|l4) L4=true ;;
                L5|l5) L5=true ;;
              esac
            done
          elif [ "$EVENT" = "schedule" ] || ([ "$EVENT" = "workflow_dispatch" ] && [ -z "$INPUT_TIERS" ]); then
            # Nightly / manual without filter: run all tiers
            L1=true; L2=true; L3=true; L4=true; L5=true
          elif [ "$EVENT" = "push" ]; then
            # Push to main: L1, L3, selective L4
            L1=true; L3=true; L4=true
          elif [ "$EVENT" = "pull_request" ]; then
            # PR: L1, L3 (selective via detect-affected)
            L1=true; L3=true
          fi

          echo "run_l1=$L1" >> "$GITHUB_OUTPUT"
          echo "run_l2=$L2" >> "$GITHUB_OUTPUT"
          echo "run_l3=$L3" >> "$GITHUB_OUTPUT"
          echo "run_l4=$L4" >> "$GITHUB_OUTPUT"
          echo "run_l5=$L5" >> "$GITHUB_OUTPUT"

          echo "Tier selection: L1=$L1 L2=$L2 L3=$L3 L4=$L4 L5=$L5"

  # =========================================================================
  # Lint
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint with lintrunner
        uses: justinchuby/lintrunner-action@main

  # =========================================================================
  # L1 — Graph Construction Smoke Tests (CPU)
  # =========================================================================
  l1-smoke:
    name: "L1: Graph Construction"
    runs-on: ubuntu-latest
    needs: [tier-selector, detect-affected]
    if: >-
      always() && !cancelled() &&
      needs.tier-selector.outputs.run_l1 == 'true' &&
      needs.tier-selector.result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-l1-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: pip-l1-

      - name: Install PyTorch CPU
        run: pip install torch --index-url ${{ env.TORCH_CPU_INDEX }}

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing]'

      - name: Run L1 smoke tests
        run: |
          pytest tests/build_graph_test.py \
            -v --tb=short -n auto \
            --junitxml=junit-l1.xml
        timeout-minutes: 10

      - name: Run supplementary L1 tests (unit, CLI, weight alignment)
        run: |
          pytest src/ tests/cli_test.py \
            -q --tb=short -n auto \
            -k "not phi4mm and not apply_weights_unknown" \
            --junitxml=junit-l1-supplementary.xml
        timeout-minutes: 10

      - name: Upload L1 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l1-results
          path: junit-l1*.xml
          retention-days: 14

  # =========================================================================
  # L2 — Architecture Validation (CPU, real HF configs, no weights)
  # =========================================================================
  l2-arch-validation:
    name: "L2: Architecture Validation"
    runs-on: ubuntu-latest
    needs: [tier-selector, l1-smoke]
    if: >-
      always() && !cancelled() &&
      needs.tier-selector.outputs.run_l2 == 'true' &&
      needs.tier-selector.result == 'success' &&
      (needs.l1-smoke.result == 'success' || needs.l1-smoke.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-l2-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: pip-l2-

      - name: Cache HuggingFace configs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-l2-${{ hashFiles('tests/arch_validation_test.py') }}
          restore-keys: hf-l2-

      - name: Install PyTorch CPU
        run: pip install torch --index-url ${{ env.TORCH_CPU_INDEX }}

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing]'

      # Run sequentially (-p no:xdist) to stay under 2GB RAM on
      # standard GitHub-hosted runners.
      - name: Run L2 architecture validation tests
        run: |
          pytest tests/arch_validation_test.py \
            -m arch_validation \
            -v -p no:xdist \
            --timeout=300 \
            --junitxml=junit-l2.xml \
            --tb=short
        timeout-minutes: 45

      - name: Upload L2 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l2-results
          path: junit-l2.xml
          retention-days: 14

  # =========================================================================
  # L3 — Synthetic Parity (CPU, random weights)
  # =========================================================================
  l3-synthetic-parity:
    name: "L3: Synthetic Parity"
    runs-on: ubuntu-latest
    needs: [tier-selector, detect-affected, l1-smoke]
    if: >-
      always() && !cancelled() &&
      needs.tier-selector.outputs.run_l3 == 'true' &&
      needs.tier-selector.result == 'success' &&
      (needs.l1-smoke.result == 'success' || needs.l1-smoke.result == 'skipped')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-l3-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: pip-l3-

      - name: Install PyTorch CPU
        run: pip install torch --index-url ${{ env.TORCH_CPU_INDEX }}

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing,transformers]'

      - name: Run L3 synthetic parity tests
        shell: bash
        run: |
          if [ ! -f tests/synthetic_parity_test.py ]; then
            echo "tests/synthetic_parity_test.py not found — skipping"
            exit 0
          fi

          # On PRs, run only affected models; otherwise run all
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ needs.detect-affected.outputs.run_all }}" != "true" ] && \
             [ "${{ needs.detect-affected.outputs.has_affected }}" = "true" ]; then
            AFFECTED='${{ needs.detect-affected.outputs.affected }}'
            echo "Running parity for affected models: $AFFECTED"
            FILTER=$(echo "$AFFECTED" | python -c "
          import json, sys, re
          names = json.load(sys.stdin)
          escaped = [re.sub(r'[^a-zA-Z0-9_]', '_', n) for n in names]
          print(' or '.join(escaped))
          ")
            if [ -n "$FILTER" ]; then
              pytest tests/synthetic_parity_test.py \
                -v --tb=short -n auto -k "$FILTER" \
                --junitxml=junit-l3.xml
            else
              echo "No affected models — skipping"
            fi
          else
            echo "Running all synthetic parity tests"
            pytest tests/synthetic_parity_test.py \
              -v --tb=short -n auto \
              --junitxml=junit-l3.xml
          fi
        timeout-minutes: 20

      - name: Upload L3 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l3-results
          path: junit-l3.xml
          retention-days: 14

  # =========================================================================
  # L4 — Checkpoint-Verified Golden Comparison (GPU, real weights)
  # =========================================================================
  l4-golden:
    name: "L4: Golden Comparison"
    # -----------------------------------------------------------------------
    # Runner configuration:
    #   Option A — GitHub-hosted larger runner with GPU:
    #     runs-on: ubuntu-gpu-a10  (or your org's GPU runner label)
    #   Option B — Self-hosted runner (like onnxruntime):
    #     runs-on: [self-hosted, Linux, GPU, CUDA]
    #   Option C — CPU-only fallback (for initial setup):
    #     runs-on: ubuntu-latest
    #
    # Update the label below to match your available runner pool.
    # -----------------------------------------------------------------------
    runs-on: [self-hosted, Linux, GPU, CUDA]
    needs: [tier-selector, l1-smoke, l3-synthetic-parity]
    if: >-
      always() && !cancelled() &&
      needs.tier-selector.outputs.run_l4 == 'true' &&
      needs.tier-selector.result == 'success' &&
      (needs.l1-smoke.result == 'success' || needs.l1-smoke.result == 'skipped') &&
      (needs.l3-synthetic-parity.result == 'success' || needs.l3-synthetic-parity.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-l4-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: pip-l4-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-l4-${{ hashFiles('testdata/cases/**/*.yaml') }}
          restore-keys: hf-l4-

      - name: Install PyTorch (CUDA)
        run: pip install torch --index-url ${{ env.TORCH_CUDA_INDEX }}

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing,transformers]'

      - name: Verify CUDA availability
        run: |
          python -c "
          import torch
          assert torch.cuda.is_available(), 'CUDA not available on this runner'
          print(f'CUDA device: {torch.cuda.get_device_name(0)}')
          print(f'CUDA version: {torch.version.cuda}')
          "

      - name: Check for golden test data
        id: check_golden
        run: |
          if find testdata/golden -name '*.json' -o -name '*.npz' 2>/dev/null | grep -q .; then
            echo "has_golden=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_golden=false" >> "$GITHUB_OUTPUT"
            echo "No golden files found — skipping L4"
          fi

      - name: Run L4 checkpoint-verified golden tests
        if: steps.check_golden.outputs.has_golden == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL_FILTER="${{ inputs.models }}"
          EXTRA_ARGS=""
          if [ -n "$MODEL_FILTER" ]; then
            EXTRA_ARGS="-k $MODEL_FILTER"
          fi

          pytest tests/e2e_golden_test.py \
            -m golden \
            -v --tb=short \
            --timeout=300 \
            --junitxml=junit-l4.xml \
            $EXTRA_ARGS
        timeout-minutes: 30

      - name: Upload L4 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l4-results
          path: junit-l4.xml
          retention-days: 30

  # =========================================================================
  # L5 — End-to-End Generation Tests (GPU, real weights)
  # =========================================================================
  l5-generation:
    name: "L5: Generation E2E"
    # Same runner config as L4 — see comments above.
    runs-on: [self-hosted, Linux, GPU, CUDA]
    needs: [tier-selector, l4-golden]
    if: >-
      always() && !cancelled() &&
      needs.tier-selector.outputs.run_l5 == 'true' &&
      needs.tier-selector.result == 'success' &&
      (needs.l4-golden.result == 'success' || needs.l4-golden.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-l5-${{ hashFiles('pyproject.toml', 'requirements/ci/requirements.txt') }}
          restore-keys: pip-l5-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-l5-${{ hashFiles('testdata/cases/**/*.yaml') }}
          restore-keys: hf-l5-

      - name: Install PyTorch (CUDA)
        run: pip install torch --index-url ${{ env.TORCH_CUDA_INDEX }}

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install -e '.[testing,transformers]'

      - name: Verify CUDA availability
        run: |
          python -c "
          import torch
          assert torch.cuda.is_available(), 'CUDA not available on this runner'
          print(f'CUDA device: {torch.cuda.get_device_name(0)}')
          "

      - name: Check for generation test data
        id: check_gen
        run: |
          if find testdata/golden -name '*.json' -o -name '*.npz' 2>/dev/null | grep -q .; then
            echo "has_gen=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gen=false" >> "$GITHUB_OUTPUT"
            echo "No golden files found — skipping L5"
          fi

      - name: Run L5 generation E2E tests
        if: steps.check_gen.outputs.has_gen == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL_FILTER="${{ inputs.models }}"
          EXTRA_ARGS=""
          if [ -n "$MODEL_FILTER" ]; then
            EXTRA_ARGS="-k $MODEL_FILTER"
          fi

          pytest tests/e2e_golden_test.py \
            -m generation \
            -v --tb=short \
            --timeout=300 \
            --junitxml=junit-l5.xml \
            $EXTRA_ARGS
        timeout-minutes: 30

      - name: Upload L5 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l5-results
          path: junit-l5.xml
          retention-days: 30

  # =========================================================================
  # Summary: aggregate results and report status
  # =========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, l1-smoke, l2-arch-validation, l3-synthetic-parity, l4-golden, l5-generation]
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v7
        with:
          path: results/
          merge-multiple: true

      - name: Report tier results
        shell: bash
        run: |
          echo "## Mobius CI — Tier Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tier | Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          declare -A TIER_STATUS
          TIER_STATUS[lint]="${{ needs.lint.result }}"
          TIER_STATUS[L1]="${{ needs.l1-smoke.result }}"
          TIER_STATUS[L2]="${{ needs.l2-arch-validation.result }}"
          TIER_STATUS[L3]="${{ needs.l3-synthetic-parity.result }}"
          TIER_STATUS[L4]="${{ needs.l4-golden.result }}"
          TIER_STATUS[L5]="${{ needs.l5-generation.result }}"

          for tier in lint L1 L2 L3 L4 L5; do
            status="${TIER_STATUS[$tier]}"
            case "$status" in
              success)  icon="✅" ;;
              failure)  icon="❌" ;;
              skipped)  icon="⏭️" ;;
              *)        icon="⚠️" ;;
            esac
            echo "| $tier | ${tier,,} | $icon $status |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Check for failures
        run: |
          # Fail the summary job if any required tier failed
          LINT="${{ needs.lint.result }}"
          L1="${{ needs.l1-smoke.result }}"
          L3="${{ needs.l3-synthetic-parity.result }}"

          if [ "$LINT" = "failure" ] || [ "$L1" = "failure" ] || [ "$L3" = "failure" ]; then
            echo "::error::Required tier(s) failed: lint=$LINT L1=$L1 L3=$L3"
            exit 1
          fi

          # L2, L4, L5 failures are reported but not blocking on PRs
          L4="${{ needs.l4-golden.result }}"
          L5="${{ needs.l5-generation.result }}"
          if [ "$L4" = "failure" ] || [ "$L5" = "failure" ]; then
            echo "::warning::GPU tier(s) failed: L4=$L4 L5=$L5"
          fi