name: "L4: Golden Checkpoint Parity (GPU)"

on:
  schedule:
    # Run nightly at 4am UTC (after golden regen on Sunday)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      affected_models:
        description: >-
          JSON array of model types.
          Empty string or empty array runs all models.
        required: false
        type: string
        default: ""
      affected_cases:
        description: JSON array of exact golden case IDs.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      affected_models:
        description: >-
          JSON array of affected model types (e.g. '["qwen2", "llama"]').
          Empty string or empty array means run all models.
        required: false
        type: string
        default: ""
      affected_cases:
        description: JSON array of exact golden case IDs.
        required: false
        type: string
        default: ""
    secrets:
      HF_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: gpu-l4-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-tests:
    name: L4 - Verify ONNX output matches HuggingFace golden checkpoints
    runs-on:
      - self-hosted
      - "1ES.Pool=onnxruntime-ep-mobius-github-linux-a10"
      - "JobId=gpu-golden-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-gpu-${{ hashFiles('testdata/cases/**/*.yaml') }}

      - name: Install PyTorch (CUDA)
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128

      - name: Install dependencies
        run: |
          pip install -r requirements/ci/requirements.txt
          pip install soundfile librosa ml_dtypes flatbuffers numpy packaging protobuf sympy coloredlogs
          pip install -e '.[testing,transformers]'
          # PyPI's ORT 1.27+ wheel requires CUDA 13, while these runners use CUDA 12.
          pip install --pre --no-deps --index-url https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/ onnxruntime-gpu
          pip install --no-deps onnxruntime-genai-cuda

      - name: Check for golden test data
        id: check_golden
        run: |
          # Only run if there are actual golden .json files (not just .gitkeep)
          if find testdata/golden -name '*.json' | grep -q .; then
            echo "has_golden=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_golden=false" >> "$GITHUB_OUTPUT"
            echo "No golden files found — skipping"
          fi

      - name: Run L4 checkpoint-verified tests
        if: steps.check_golden.outputs.has_golden == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MOBIUS_TEST_DEVICE: cuda
          AFFECTED_MODELS: ${{ inputs.affected_models }}
          AFFECTED_CASES: ${{ inputs.affected_cases }}
        run: |
          AFFECTED="$AFFECTED_MODELS"
          CASES="$AFFECTED_CASES"
          if { [ -z "$AFFECTED" ] || [ "$AFFECTED" = "[]" ]; } && \
             { [ -z "$CASES" ] || [ "$CASES" = "[]" ]; }; then
            echo "Running all L4 golden comparison tests"
            pytest tests/e2e_golden_test.py \
              -m golden \
              -v \
              --timeout=300 \
              --junitxml=junit-l4.xml \
              --cov=src --cov-report=xml --cov-branch \
              --tb=short
          else
            if [ -n "$AFFECTED" ] && [ "$AFFECTED" != "[]" ]; then
              echo "Running L4 golden tests for affected models: $AFFECTED"
              # Convert JSON array to comma-separated list for --models
              MODELS=$(echo "$AFFECTED" | python -c "import json, sys; print(','.join(json.load(sys.stdin)))")
              if [ -n "$MODELS" ]; then
                pytest tests/e2e_golden_test.py \
                  -m golden \
                  -v \
                  --models "$MODELS" \
                  --timeout=300 \
                  --junitxml=junit-l4-models.xml \
                  --cov=src --cov-report=xml --cov-branch \
                  --tb=short \
                  || { rc=$?; if [ $rc -eq 5 ]; then echo "No matching tests found — skipping"; else exit $rc; fi; }
              fi
            fi
            if [ -n "$CASES" ] && [ "$CASES" != "[]" ]; then
              echo "Running L4 golden tests for exact cases: $CASES"
              MOBIUS_GOLDEN_CASES="$CASES" pytest tests/e2e_golden_test.py \
                -m golden \
                -v \
                --timeout=300 \
                --junitxml=junit-l4-cases.xml \
                --cov=src --cov-append --cov-report=xml --cov-branch \
                --tb=short
            fi
          fi
        timeout-minutes: 60

      - name: Upload coverage to Codecov
        if: always() && steps.check_golden.outputs.has_golden == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: gpu-l4
      - name: Upload L4 test results to Codecov
        if: steps.check_golden.outputs.has_golden == 'true' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: gpu-l4
          report-type: test_results
          files: junit-l4*.xml

      - name: Upload test results
        if: always() && steps.check_golden.outputs.has_golden == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gpu-l4-test-results
          path: junit-l4*.xml
          retention-days: 30
